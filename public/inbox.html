<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Job Costs Inbox</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f4f7f6; --card: #fff; --ink: #17312b; --muted: #6b8a82; --line: #e3ece9; --line2: #f0f5f3;
    --brand: #10b981; --brand-dark: #059669; --brand-soft: #e7f8f1; --warn: #b45309; --warn-soft: #fef3c7;
    --bad: #be123c; --bad-soft: #ffe4e6; --sun: #f97316;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 13.5px/1.45 "Plus Jakarta Sans", "Segoe UI", -apple-system, Roboto, Arial, sans-serif; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 18px 16px; }
  header { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-bottom: 6px; }
  header h1 { margin: 0; font-size: 22px; font-weight: 800; }
  .muted { color: var(--muted); }
  .badge { display: inline-flex; align-items: center; justify-content: center; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px; background: var(--sun); color: #fff; font-size: 11px; font-weight: 800; }
  button, .btn { font: inherit; font-weight: 600; border: 1px solid #d6e2de; background: #fff; color: var(--ink); border-radius: 10px; padding: 6px 12px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
  button.primary { background: var(--brand); border-color: var(--brand); color: #fff; box-shadow: 0 4px 12px rgba(16, 185, 129, .28); }
  button.danger { color: var(--bad); }
  select { font: inherit; border: 1px solid #d6e2de; border-radius: 10px; padding: 6px 8px; background: #fff; color: var(--ink); max-width: 260px; }
  .address { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 4px 0 18px; padding: 12px 14px; background: var(--card); border: 1px solid var(--line); border-radius: 16px; }
  .address code { background: var(--brand-soft); color: var(--brand-dark); padding: 5px 10px; border-radius: 8px; font-size: 13px; }
  h2 { font-size: 15px; margin: 20px 0 8px; display: flex; align-items: center; gap: 8px; }
  .item { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; margin-bottom: 8px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: center; }
  .item .t { font-weight: 700; font-size: 14px; }
  .item .sub { font-size: 12px; color: var(--muted); }
  .acts { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; align-items: center; }
  .chip { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 700; padding: 2px 9px; border-radius: 20px; white-space: nowrap; }
  .c-sugg { background: var(--warn-soft); color: #92400e; } .c-dup { background: #f1f5f9; color: #64748b; } .c-err { background: var(--bad-soft); color: var(--bad); } .c-proc { background: var(--brand-soft); color: var(--brand-dark); }
  .trace { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 5px; font-size: 11.5px; }
  .trace span { padding: 1px 8px; border-radius: 10px; background: #f0fdf4; color: #166534; }
  .trace span.left { background: var(--warn-soft); color: #92400e; }
  .trace span.dup { background: var(--bad-soft); color: var(--bad); }
  .ilist { border: 1px solid var(--line); border-radius: 12px; max-height: 340px; overflow: auto; }
  .irow { display: flex; gap: 8px; align-items: center; padding: 7px 10px; border-top: 1px solid var(--line2); font-size: 13px; cursor: pointer; }
  .irow:first-child { border-top: 0; } .irow.head { background: #fbfdfc; position: sticky; top: 0; }
  .irow.done { opacity: .6; } .irow .folder { font-weight: 700; text-decoration: none; color: var(--ink); }
  .lnk, .acts .lnk { background: none; border: 0; padding: 4px 6px; color: var(--brand-dark); text-decoration: underline; box-shadow: none; }
  .recent .item { background: #fbfdfc; }
  .empty { text-align: center; color: var(--muted); padding: 26px; background: var(--card); border: 1px dashed var(--line); border-radius: 16px; }
  .spin { display: inline-block; width: 11px; height: 11px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin .8s linear infinite; vertical-align: -2px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 9px 16px; border-radius: 12px; font-weight: 600; opacity: 0; transition: .2s; pointer-events: none; }
  .toast.show { opacity: 1; }
  @media (max-width: 720px) { .item { grid-template-columns: minmax(0, 1fr); } .acts { justify-content: flex-start; } }
  @media (max-width: 640px) { .wrap { padding: 12px 10px; } .panel { overflow-x: auto; } header h1 { font-size: 19px; } }
</style>
</head>
<body>
<div class="wrap">
  <header><a class="btn" data-back href="#" onclick="location.href=(BOOT.home?'/home?t=':'/card?t=')+encodeURIComponent(BOOT.token);return false" style="margin-right:4px">← Back to job</a><h1>📥 Inbox</h1><span class="muted">Invoices that came in by email and aren't on a job yet</span></header>
  <div class="address" id="address"></div>
  <!-- Every way of adding invoices, together on one row -->
  <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:-4px 0 14px">
    <label class="btn" style="background:var(--brand);color:#fff;border-color:var(--brand)">⬆ Upload invoices<input type="file" id="inboxUpload" multiple accept="application/pdf,image/*" hidden></label>
    <span id="outlookBar" class="muted" style="display:contents"></span>
  </div>
  <div id="importBox" hidden style="background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin:-4px 0 14px"></div>
  <div id="content"><div class="empty"><span class="spin"></span></div></div>
</div>
<div class="toast" id="toast"></div>
<script>
const BOOT = /*__BOOT__*/null;
// Session: the server sends a fresh token while the window is in use; links on the page and the address bar follow it.
function noteToken(res) {
  const nt = res && res.headers && res.headers.get('X-Session-Token');
  if (!nt || !BOOT || nt === BOOT.token) return;
  const oldEnc = encodeURIComponent(BOOT.token), newEnc = encodeURIComponent(nt);
  BOOT.token = nt;
  try { T = newEnc; } catch (e) { /* this page keeps no copy */ }
  document.querySelectorAll('a[href]').forEach((a) => { if (a.getAttribute('href').includes(oldEnc)) a.setAttribute('href', a.getAttribute('href').split(oldEnc).join(newEnc)); });
  if (location.search.includes(oldEnc)) history.replaceState(null, '', location.href.split(oldEnc).join(newEnc));
}
try { const u = new URL(location.href); if (BOOT && BOOT.token && u.searchParams.get('t') && u.searchParams.get('t') !== BOOT.token) { u.searchParams.set('t', BOOT.token); history.replaceState(null, '', u); } } catch (e) { /* fine */ }
if (BOOT && BOOT.home) document.querySelectorAll('[data-back]').forEach((a) => { a.textContent = '← Job Costs home'; });
// On the ServiceM8 iPhone/iPad app a new tab means leaving ServiceM8 for Safari: open our own pages in this window instead
// (Microsoft's sign-in stays outside: it won't show inside a frame).
(function () {
  const ios = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  if (!ios) return;
  document.addEventListener('click', (e) => {
    const a = e.target.closest && e.target.closest('a[target="_blank"]');
    if (!a || !a.href) return;
    let u; try { u = new URL(a.href, location.href); } catch (x) { return; }
    if (u.origin !== location.origin || u.pathname.startsWith('/outlook/')) return;
    e.preventDefault(); location.href = u.href;
  }, true);
})();
setInterval(() => { if (BOOT && BOOT.token) fetch('/api/ping', { headers: { Authorization: 'Bearer ' + BOOT.token } }).then(noteToken).catch(() => {}); }, 30 * 60 * 1000);
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const money = (n) => (Number(n) || 0).toLocaleString('en-AU', { style: 'currency', currency: 'AUD' });
const fmtDate = (d) => d ? new Date(d + 'T00:00:00').toLocaleDateString('en-AU', { day: 'numeric', month: 'short', year: 'numeric' }) : '';
const qty = (n) => String(+(+n).toFixed(3));
let data = null;
let timer = null;
const changing = new Set(); // invoices whose "✎ Change" box is open

function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 2400); }
async function api(path, opts = {}) {
  const res = await fetch('/api' + path, { ...opts, headers: { Authorization: 'Bearer ' + BOOT.token, ...(opts.body ? { 'Content-Type': 'application/json' } : {}) } });
  noteToken(res);
  const body = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(body.error || 'Something went wrong');
  return body;
}

let outlookStatus = null;
async function load() {
  api('/outlook').then((o) => { outlookStatus = o; renderOutlook(); }).catch(() => {});
  try { data = await api('/inbox'); render(); } catch (e) { $('#content').innerHTML = `<div class="empty">${esc(e.message)}</div>`; return; }
  clearTimeout(timer);
  if (data.pending.some((p) => p.status === 'processing') || data.invoices.some((i) => i.price_check_status === 'checking')) timer = setTimeout(load, 3000);
}

const PC = { ok: ['✓ Price OK', 'c-proc'], check: ['Check price', 'c-sugg'], problem: ['⚠ Price problem', 'c-err'], no_match: ['Not on price list', 'c-dup'] };
function pcChip(inv) {
  if (inv.price_check_status === 'checking') return '<span class="chip c-sugg"><span class="spin"></span> 💲 checking price</span>';
  const pc = inv.price_check;
  if (inv.price_check_status !== 'done' || !pc || !PC[pc.verdict]) return '';
  return `<span class="chip ${PC[pc.verdict][1]}" title="${esc(pc.headline || '')}">💲 ${PC[pc.verdict][0]}</span>`;
}
const jobLabel = (j) => `#${j.job_number}${j.job_title ? ' – ' + j.job_title : ''}${j.is_stock ? ' (stock order)' : ''}`;
const fileLink = (i) => (!i.file_path ? '' : `<a class="btn" href="${i.mime_type === 'application/pdf'
  ? `/viewer.html?id=${i.id}&t=${encodeURIComponent(BOOT.token)}&name=${encodeURIComponent(i.supplier || 'Invoice')}`
  : `/api/invoices/${i.id}/file?t=${encodeURIComponent(BOOT.token)}${/^text\//.test(i.mime_type || '') ? '&view=html' : ''}`}" target="_blank" rel="noopener">View</a>`);
const openJob = (uuid, num) => (uuid ? `<button class="lnk" data-open-job="${esc(uuid)}" title="Open this job's Job Costs">Open job #${esc(num || '?')} ↗</button>` : '');
// Where the possible duplicate is, with a button to go and look.
function dupNote(d, skipJob) {
  if (!d) return '';
  const where = d.jobs.length ? `already on ${d.jobs.map((j) => '#' + esc(j.job_number || '?')).join(', ')}` : d.in_stock ? 'already in stock' : 'also here in the Inbox';
  return `<div class="trace"><span class="dup">⚠ Possible duplicate (${esc(d.reason)}${d.invoice_number ? ', #' + esc(d.invoice_number) : ''}) – ${where}</span>${d.jobs.filter((j) => j.job_uuid !== skipJob).map((j) => openJob(j.job_uuid, j.job_number)).join('')}</div>`;
}
const agoText = (t) => { const m = Math.round((Date.now() - Date.parse(t)) / 60000); return m < 1 ? 'just now' : m < 60 ? `${m} min ago` : m < 1440 ? `${Math.round(m / 60)} h ago` : `${Math.round(m / 1440)} d ago`; };
function renderOutlook() {
  const o = outlookStatus;
  $('#outlookBar').innerHTML = !o || !o.connected ? ''
    : `<button data-import-open>📂 Import from Outlook…</button><button data-check-now>↻ Check now</button>
      <span class="muted" style="font-size:12.5px">📥 Reading <b>${esc(o.email || '')}</b> · ${esc(o.hours || '')}${o.lastCheck ? ' · last checked ' + agoText(o.lastCheck) : ''}</span>${o.error ? ` <span style="color:var(--bad)">⚠ ${esc(o.error)}</span>` : ''}`;
}

// ---------- Import from Outlook: browse folders, tick folders or emails ----------
const imp = { path: [{ id: null, name: 'Mailbox' }], folders: [], messages: [], next: null, loading: false, emails: new Map(), whole: new Map() };
async function openImport() { $('#importBox').hidden = false; imp.path = imp.path.slice(0, imp.path.length); return browse(); }
async function browse(more = false) {
  const here = imp.path[imp.path.length - 1];
  imp.loading = true; renderImport();
  try {
    const q = new URLSearchParams();
    if (here.id) q.set('folder', here.id);
    if (more && imp.next) q.set('page', imp.next);
    const r = await api('/outlook/browse?' + q);
    if (!more) { imp.folders = r.folders || []; imp.messages = []; }
    imp.messages.push(...r.messages);
    imp.next = r.next;
  } catch (x) { toast(x.message); }
  imp.loading = false; renderImport();
}
const fmtWhen = (t) => t ? new Date(t).toLocaleDateString('en-AU', { day: 'numeric', month: 'short', year: '2-digit' }) : '';
function renderImport() {
  const here = imp.path[imp.path.length - 1];
  const crumbs = imp.path.map((p, i) => i === imp.path.length - 1 ? `<b>${esc(p.name)}</b>` : `<button class="lnk" data-crumb="${i}">${esc(p.name)}</button>`).join(' › ');
  const folderRows = imp.folders.map((f) => `<div class="irow"><input type="checkbox" data-pick-folder="${esc(f.id)}" data-name="${esc(f.name)}" ${imp.whole.has(f.id) ? 'checked' : ''} title="Import every email in this folder">
      <button class="lnk folder" data-open-folder="${esc(f.id)}" data-name="${esc(f.name)}">📁 ${esc(f.name)}</button>
      <span class="muted">${f.count != null ? f.count + ' email' + (f.count === 1 ? '' : 's') : ''}${f.childCount ? ` · ${f.childCount} folder${f.childCount === 1 ? '' : 's'}` : ''}</span><span style="flex:1"></span>
      <button class="small" data-open-folder="${esc(f.id)}" data-name="${esc(f.name)}">Open ›</button></div>`).join('');
  const pickable = imp.messages.filter((m) => !m.status || m.status === 'new');
  // What became of each email: only ones really in Job Costs are greyed out
  const WHY = { quote: 'a quote', statement: 'a statement', remittance: 'a remittance', not_invoice: 'not an invoice', nothing: 'no PDF or invoice in it', not_kept: 'nothing kept from it', duplicate: 'already in Job Costs' };
  const badge = (m) => ({
    imported: '<span class="chip c-proc">✓ in Job Costs</span>',
    statement: '<span class="chip" style="background:#eef2ff;color:#3730a3">📄 in Statement check</span>',
    deleted: '<span class="chip c-dup">imported, then deleted</span>',
    skipped: `<span class="chip c-sugg" title="Job Costs read it and didn't keep it">read: ${esc(WHY[m.why] || 'not kept')}</span>`,
  }[m.status] || '');
  const allOn = pickable.length && pickable.every((m) => imp.emails.has(m.id));
  const mailRows = imp.messages.map((m) => `<label class="irow ${['imported', 'statement'].includes(m.status) ? 'done' : ''}"><input type="checkbox" data-pick-mail="${esc(m.id)}" ${imp.emails.has(m.id) ? 'checked' : ''} ${['imported', 'statement'].includes(m.status) ? 'title="Already in Job Costs – tick to bring it in again"' : ''}>
      <span class="muted" style="width:72px">${esc(fmtWhen(m.received))}</span><span style="width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(m.from)}</span>
      <span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${m.hasAttachments ? '📎 ' : ''}${esc(m.subject)}</span>
      ${badge(m)}</label>`).join('');
  const n = imp.emails.size, f = imp.whole.size;
  $('#importBox').innerHTML = `<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><b>Import invoices from Outlook</b><span class="muted">·</span><span>${crumbs}</span><span style="flex:1"></span><button data-import-close>✕ Close</button></div>
    <div class="muted" style="font-size:12.5px;margin:4px 0 8px">Open folders like in Outlook. Tick single emails, or tick a folder to bring in every email in it. Only invoices are kept (quotes, statements and other emails are skipped), and nothing comes in twice.</div>
    ${imp.loading && !imp.messages.length && !imp.folders.length ? '<div class="muted"><span class="spin"></span> Loading…</div>' : ''}
    ${folderRows ? `<div class="ilist">${folderRows}</div>` : ''}
    ${here.id ? (imp.messages.length ? `<div class="ilist" style="margin-top:8px"><label class="irow head"><input type="checkbox" data-pick-all ${allOn ? 'checked' : ''} ${pickable.length ? '' : 'disabled'}> <b>Emails in ${esc(here.name)}</b> <span class="muted">(tick to select all shown)</span></label>${mailRows}</div>
      ${imp.next ? `<div style="margin-top:6px"><button data-more ${imp.loading ? 'disabled' : ''}>${imp.loading ? 'Loading…' : 'Show older emails'}</button></div>` : ''}` : (imp.loading ? '' : '<div class="muted" style="margin-top:6px">No emails in this folder.</div>')) : ''}
    <div style="display:flex;gap:8px;align-items:center;margin-top:10px;padding-top:10px;border-top:1px solid var(--line2)">
      <span>${n || f ? `<b>${[n ? `${n} email${n === 1 ? '' : 's'}` : '', f ? `${f} whole folder${f === 1 ? '' : 's'} (${[...imp.whole.values()].map(esc).join(', ')})` : ''].filter(Boolean).join(' + ')}</b> ticked` : '<span class="muted">Nothing ticked yet</span>'}</span>
      <span style="flex:1"></span>${n || f ? '<button data-import-clear>Untick all</button>' : ''}<button class="primary" data-import-go ${n || f ? '' : 'disabled'}>📂 Import ticked</button></div>`;
}

function render() {
  $('#address').innerHTML = data.inboxAddress
    ? `<span>Send or forward every supplier invoice to</span><code id="addr">${esc(data.inboxAddress)}</code><button data-copy>Copy</button><span class="muted">Tip: put the job number on your orders (e.g. “PO 208126”) and invoices get matched automatically.</span>`
    : (outlookStatus && outlookStatus.connected ? '' : '<span class="muted">Email-in is not set up on the server yet.</span>');
  $('#address').style.display = $('#address').innerHTML ? '' : 'none';
  const fresh = data.invoices.filter((i) => i.untouched && !i.kept_as_stock);
  const stock = data.invoices.filter((i) => !(i.untouched && !i.kept_as_stock) && !i.duplicate_of);
  // Type a job number; the browser suggests matching jobs as you type.
  const jobBox = (id, other) => `<span style="display:inline-flex;gap:4px"><input id="j-${id}" list="jobList" data-job-input="${id}" placeholder="${other ? 'Other job #' : 'Job #'}" autocomplete="off"
    style="width:120px;font:inherit;border:1px solid #d6e2de;border-radius:10px;padding:6px 8px"><button data-assign-pick="${id}">Add</button></span>`;
  // key: which box (an invoice can show in two lists); id: the invoice
  const moveBox = (key, id, { stock = true, label = 'Move' } = {}) => `<span style="display:inline-flex;gap:4px;flex-wrap:wrap"><input id="m-${key}" list="jobList" placeholder="Job #" autocomplete="off"
    style="width:110px;font:inherit;border:1px solid #d6e2de;border-radius:10px;padding:6px 8px"><button class="primary" data-move-pick="${id}" data-key="${key}">${label}</button>${stock ? `<button data-move-stock="${id}" data-key="${key}" title="Not for one job">📦 To stock</button>` : ''}</span>`;
  let h = data.statementsWaiting ? `<div class="item" style="background:#eef2ff;border-color:#c7d2fe"><div>📄 <b>${data.statementsWaiting} supplier statement${data.statementsWaiting === 1 ? '' : 's'}</b> came in and ${data.statementsWaiting === 1 ? 'was' : 'were'} moved to Statement check, ready to run.</div>
    <div class="acts"><a class="btn" href="/checks?t=${encodeURIComponent(BOOT.token)}">🔎 Open Statement check</a></div></div>` : '';
  h += `<h2>Needs a job <span class="badge">${fresh.length + data.pending.length}</span></h2>`;
  if (!fresh.length && !data.pending.length) h += '<div class="empty">✅ Nothing waiting. New invoices emailed in will show up here.</div>';
  for (const p of data.pending) {
    h += `<div class="item"><div><div class="t">${esc(p.file_name || 'Invoice')} ${p.status === 'processing' ? '<span class="chip c-proc"><span class="spin"></span> Reading</span>' : '<span class="chip c-err">Couldn’t read</span>'}</div>
      <div class="sub">${esc([p.email_from, p.email_subject && '“' + p.email_subject + '”'].filter(Boolean).join(' · '))}${p.error ? ' · ' + esc(p.error) : ''}</div></div>
      <div class="acts">${p.status === 'error' ? `<button class="danger" data-del="${p.id}">Delete</button>` : ''}</div></div>`;
  }
  for (const i of fresh) {
    const s = i.suggestion;
    h += `<div class="item"><div><div class="t">${esc(i.supplier || 'Unknown supplier')} <span class="muted" style="font-weight:600">${money(i.total_ex ?? i.total)} ex GST</span>${i.duplicate_of ? ' <span class="chip c-dup">Looks like a duplicate</span>' : ''}</div>
      <div class="sub">${esc([i.invoice_number && '#' + i.invoice_number, fmtDate(i.invoice_date), i.lines.length + ' line' + (i.lines.length === 1 ? '' : 's'), i.email_from, i.source === 'outlook' && 'from Outlook'].filter(Boolean).join(' · '))}</div>
      ${pcChip(i) ? `<div style="margin-top:5px;font-size:12px;display:flex;gap:6px;align-items:center;flex-wrap:wrap">${pcChip(i)}<span class="muted">${esc(i.price_check && i.price_check_status === 'done' ? i.price_check.headline || '' : '')}</span></div>` : ''}
      ${s ? `<div class="trace"><span class="left">💡 Looks like ${esc(jobLabel(s))} – ${esc(s.reason || '')}</span></div>` : ''}
      ${i.looks_like_stock ? '<div class="trace"><span class="left">💡 Looks like stock – no job number or site on it, and it reads like a restock order</span></div>' : ''}
      ${dupNote(i.possible_duplicate, s && s.job_uuid)}</div>
      <div class="acts">${fileLink(i)}
        <label title="Tick to mark it paid when you add it" style="display:inline-flex;align-items:center;gap:4px;font-weight:600;white-space:nowrap"><input type="checkbox" id="pd-${i.id}"> Paid</label>
        ${s ? `<button class="primary" data-assign="${i.id}" data-job="${esc(s.job_uuid)}">✓ ${s.is_stock ? 'Add to stock order' : 'Add to'} #${esc(s.job_number)}</button>` : ''}
        ${jobBox(i.id, !!s)}
        <button class="${i.looks_like_stock ? 'primary' : ''}" data-stock="${i.id}" title="Not for one job – keep it to take items from later">${i.looks_like_stock ? '✓ ' : ''}📦 Send to stock</button>
        ${s && !s.is_stock ? openJob(s.job_uuid, s.job_number) : ''}
        <button class="danger" data-del="${i.id}" title="Not a cost (e.g. a remittance or a duplicate)">🗑 Delete</button></div></div>`;
  }
  const recent = data.recent || [];
  if (recent.length) {
    h += `<h2>Recently approved <span class="muted" style="font-weight:600;font-size:12px">last 14 days – approved the wrong one? Undo puts it back above</span></h2><div class="recent">`;
    for (const r of recent) {
      h += `<div class="item"><div><div class="t">${esc(r.supplier || 'Unknown supplier')} <span class="muted" style="font-weight:600">${money(r.total_ex ?? r.total)} ex GST</span></div>
        <div class="sub">${esc([r.invoice_number && '#' + r.invoice_number, fmtDate(r.invoice_date)].filter(Boolean).join(' · '))} → <b>${r.to_stock ? '📦 stock' + (r.stock_job_number ? ' (stock order #' + esc(r.stock_job_number) + ')' : '') : 'job #' + esc(r.job_number || '?')}</b> · ${agoText(r.approved_at)}</div>
        ${dupNote(r.possible_duplicate, r.job_uuid)}</div>
        <div class="acts">${fileLink(r)}${r.to_stock ? '' : openJob(r.job_uuid, r.job_number)}${changing.has('r' + r.id)
          ? moveBox('r' + r.id, r.id, { stock: !r.to_stock }) + '<button data-change="r' + r.id + '">Cancel</button>'
          : `${r.movable ? `<button data-change="r${r.id}" title="Put it on a different job${r.to_stock ? '' : ' or in stock'}">✎ Change</button>` : ''}<button data-undo="${r.id}">↶ Undo</button>`}</div></div>`;
    }
    h += '</div>';
  }
  // Stock has its own page
  if (stock.length) {
    const left = stock.reduce((a, i) => a + (Number(i.left_amount) || 0), 0);
    h += `<div class="item" style="margin-top:18px"><div>📦 <b>${stock.length} invoice${stock.length === 1 ? '' : 's'} in stock</b> <span class="muted">· ${money(left)} ex GST left</span></div>
      <div class="acts"><a class="btn" href="/stock?t=${encodeURIComponent(BOOT.token)}">📦 Open Stock</a></div></div>`;
  }
  h += `<datalist id="jobList">${data.jobs.map((j) => `<option value="${esc(j.job_number)}">${esc([j.job_title, j.is_stock ? 'stock order' : '', j.sm8_status && j.sm8_status !== 'Work Order' ? j.sm8_status : ''].filter(Boolean).join(' · '))}</option>`).join('')}</datalist>`;
  $('#content').innerHTML = h;
}
// Enter in a job number box = Add
document.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && e.target.dataset && e.target.dataset.jobInput) { e.preventDefault(); document.querySelector(`[data-assign-pick="${e.target.dataset.jobInput}"]`).click(); }
});

document.addEventListener('change', async (e) => {
  if (e.target.id === 'inboxUpload') return uploadToInbox(e.target.files);
  const t = e.target;
  if (t.dataset.pickMail) { t.checked ? imp.emails.set(t.dataset.pickMail, true) : imp.emails.delete(t.dataset.pickMail); return renderImport(); }
  if (t.dataset.pickFolder) { t.checked ? imp.whole.set(t.dataset.pickFolder, t.dataset.name) : imp.whole.delete(t.dataset.pickFolder); return renderImport(); }
  if (t.dataset.pickAll !== undefined) { for (const m of imp.messages) if (!m.status || m.status === 'new') t.checked ? imp.emails.set(m.id, true) : imp.emails.delete(m.id); return renderImport(); }
});
document.addEventListener('click', async (e) => {
  const b = e.target.closest('button'); if (!b) return;
  const d = b.dataset;
  try {
    if (d.copy !== undefined) { await navigator.clipboard.writeText($('#addr').textContent).catch(() => {}); return toast('Email address copied'); }
    const paidTick = (id) => !!($('#pd-' + id) && $('#pd-' + id).checked);
    const andPaid = (id) => (paidTick(id) ? ' and marked paid' : '');
    if (d.assign) { await api(`/inbox/${d.assign}/assign`, { method: 'POST', body: JSON.stringify({ job_uuid: d.job, paid: paidTick(d.assign) }) }); toast('Added to the job' + andPaid(d.assign)); return load(); }
    if (d.assignPick) {
      const n = $('#j-' + d.assignPick).value.trim().replace(/^#/, '').split(/[\s–-]/)[0];
      if (!n) { $('#j-' + d.assignPick).focus(); return toast('Type a job number'); }
      b.disabled = true;
      const r = await api(`/inbox/${d.assignPick}/assign`, { method: 'POST', body: JSON.stringify({ job_number: n, paid: paidTick(d.assignPick) }) });
      toast('Added to #' + (r.job_number || n) + andPaid(d.assignPick)); return load();
    }
    if (d.change) { const k = d.change; changing.has(k) ? changing.delete(k) : changing.add(k); render(); const el = $('#m-' + k); if (el) el.focus(); return; }
    if (d.movePick || d.moveStock) {
      const id = Number(d.movePick || d.moveStock);
      const n = d.movePick ? $('#m-' + d.key).value.trim().replace(/^#/, '').split(/[\s–-]/)[0] : null;
      if (d.movePick && !n) { $('#m-' + d.key).focus(); return toast('Type a job number'); }
      b.disabled = true;
      const r = await api(`/inbox/${id}/move`, { method: 'POST', body: JSON.stringify(n ? { job_number: n } : { to_stock: true }) });
      changing.delete(d.key);
      toast(r.unchanged ? 'It\u2019s already there' : r.to_stock ? 'Moved to stock' + (r.job_number ? ' (stock order #' + r.job_number + ')' : '') : 'Moved to #' + r.job_number);
      if (r.diaryWarning) toast(r.diaryWarning);
      return load();
    }
    if (d.stock) { await api(`/inbox/${d.stock}/stock`, { method: 'POST', body: JSON.stringify({ paid: paidTick(d.stock) }) }); toast('Sent to stock' + andPaid(d.stock) + ' – take items from it on any job'); return load(); }
    if (d.del) {
      if (!b.dataset.sure) { b.dataset.sure = '1'; b.textContent = 'Sure? Delete'; setTimeout(() => { delete b.dataset.sure; b.textContent = '🗑 Delete'; }, 4000); return; }
      await api(`/inbox/${d.del}`, { method: 'DELETE' }); toast('Deleted'); return load();
    }
    if (d.importOpen !== undefined) return openImport();
    if (d.importClose !== undefined) { $('#importBox').hidden = true; return; }
    if (d.openFolder) { imp.path.push({ id: d.openFolder, name: d.name }); return browse(); }
    if (d.crumb !== undefined) { imp.path = imp.path.slice(0, Number(d.crumb) + 1); return browse(); }
    if (d.more !== undefined) return browse(true);
    if (d.importClear !== undefined) { imp.emails.clear(); imp.whole.clear(); return renderImport(); }
    if (d.importGo !== undefined) {
      const wholeNames = [...imp.whole.values()];
      if (wholeNames.length && !confirm(`Import every email in: ${wholeNames.join(', ')}?`)) return;
      const repeats = imp.messages.filter((m) => ['imported', 'statement'].includes(m.status) && imp.emails.has(m.id)).length;
      if (repeats && !confirm(`${repeats} of the ticked emails ${repeats === 1 ? 'is' : 'are'} already in Job Costs. Bring ${repeats === 1 ? 'it' : 'them'} in again?`)) return;
      b.disabled = true; b.textContent = 'Importing… (this can take a minute)';
      try {
        const r = await api('/outlook/import-chosen', { method: 'POST', body: JSON.stringify({ message_ids: [...imp.emails.keys()], folder_ids: [...imp.whole.keys()], again: true }) });
        imp.emails.clear(); imp.whole.clear();
        $('#importBox').hidden = true;
        toast(`${r.emails} email${r.emails === 1 ? '' : 's'} found: ${r.files} file${r.files === 1 ? '' : 's'} being read${r.skipped ? ` · ${r.skipped} already imported` : ''}${r.notInvoices ? ` · ${r.notInvoices} without an invoice` : ''}`);
      } finally { b.disabled = false; b.textContent = '📂 Import ticked'; }
      return load();
    }
    if (d.undo) { const r = await api(`/inbox/${d.undo}/undo`, { method: 'POST' }); toast(r.diaryWarning || 'Back in the Inbox'); return load(); }
    if (d.openJob) { const r = await api(`/jobs/${encodeURIComponent(d.openJob)}/open`); location.href = '/card?t=' + encodeURIComponent(r.token); return; }
    if (d.checkNow !== undefined) {
      b.disabled = true; b.textContent = 'Checking…';
      const r = await api('/outlook/check', { method: 'POST' });
      toast(r.found ? `Found ${r.found} email${r.found === 1 ? '' : 's'} with possible invoices – reading them now` : 'Nothing new in Outlook');
      return load();
    }
  } catch (x) { toast(x.message); }
});
async function uploadToInbox(files) {
  if (!files || !files.length) return;
  const fd = new FormData();
  for (const f of files) fd.append('files', f);
  toast(`Uploading ${files.length} file${files.length === 1 ? '' : 's'}…`);
  try {
    const res = await fetch('/api/inbox/upload', { method: 'POST', body: fd, headers: { Authorization: 'Bearer ' + BOOT.token } });
  noteToken(res);
    const b = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(b.error || 'Upload failed');
    toast(`Reading ${b.created.length} invoice${b.created.length === 1 ? '' : 's'}… each gets a suggested job`);
  } catch (x) { toast(x.message); }
  $('#inboxUpload').value = '';
  load();
}
// Drop files anywhere on the page
document.addEventListener('dragover', (e) => { if ([...(e.dataTransfer?.types || [])].includes('Files')) e.preventDefault(); });
document.addEventListener('drop', (e) => { if (e.dataTransfer?.files?.length) { e.preventDefault(); uploadToInbox(e.dataTransfer.files); } });
load();
// New invoices (e.g. from Outlook) show up without reloading, unless you're in the middle of choosing something.
setInterval(() => { if (!document.activeElement || !document.activeElement.matches('select, input')) load(); }, 60000);
</script>
