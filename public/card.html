<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Job Costs</title>
<!--__SM8_SDK__-->
<style>
  :root {
    --bg: #f5f6f8; --card: #fff; --ink: #1f2933; --muted: #7b8794; --line: #e4e7eb;
    --accent: #4a86e8; --accent-soft: #eaf1fd; --ok: #2e9e5b; --ok-ink: #17784a; --ok-soft: #e3f6ec;
    --warn: #b45309; --warn-soft: #fff1e0; --bad: #c2410c; --bad-soft: #fde8e4; --radius: 8px;
    --mk: #be123c; --mk-soft: #ffe4e8; --mk-row: #fff6f7;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 13px/1.45 "Open Sans", "Segoe UI", -apple-system, Roboto, Helvetica, Arial, sans-serif; }
  .wrap { padding: 14px; max-width: 1400px; margin: 0 auto; }
  header { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
  header h1 { font-size: 17px; margin: 0; }
  header .sub { color: var(--muted); }
  .panel { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); }
  button, .btn { font: inherit; border: 1px solid #cfd5dc; background: #fff; color: var(--ink); border-radius: 4px; padding: 5px 10px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
  button:hover, .btn:hover { background: #f7f8fa; }
  button.primary { background: var(--ok); border-color: var(--ok); color: #fff; }
  button.link { border: 0; background: none; color: var(--accent); padding: 2px 4px; }
  button.danger { color: var(--bad); }
  button.solid-danger { background: var(--bad); border-color: var(--bad); color: #fff; }
  .muted { color: var(--muted); }
  .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }

  /* ---- Quote vs costs ---- */
  .summary { display: grid; grid-template-columns: minmax(0, 1fr) 250px; gap: 18px; padding: 14px 16px; margin-bottom: 12px; }
  .s-top { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
  .s-label { color: var(--muted); font-size: 12px; }
  .s-big { font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .s-big small { font-size: 14px; font-weight: 400; color: var(--muted); }
  .s-big button.link { font-size: 13px; font-weight: 400; vertical-align: 2px; }
  .s-margin { text-align: right; }
  .s-margin .s-big.good { color: var(--ok-ink); } .s-margin .s-big.bad { color: var(--bad); }
  .bar { position: relative; display: flex; height: 16px; border-radius: 8px; background: #eceff3; margin: 10px 0 6px; }
  .bar > span { height: 100%; }
  .bar > span:first-child { border-radius: 8px 0 0 8px; }
  .bar .quote-mark { position: absolute; top: -4px; bottom: -4px; width: 3px; background: var(--ink); border-radius: 2px; }
  .s-foot { display: flex; gap: 16px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
  .s-foot b { color: var(--ink); font-weight: 600; }
  .compare { border-collapse: collapse; margin: 10px 0 2px; width: auto; }
  .compare th { font-weight: 500; padding: 2px 18px 2px 0; border: 0; font-size: 11.5px; }
  .compare td { padding: 3px 18px 3px 0; border: 0; font-size: 14px; font-variant-numeric: tabular-nums; }
  .compare td:first-child { font-size: 12.5px; color: var(--muted); }
  .compare tr.actual td { font-weight: 700; font-size: 16px; }
  .compare tr.actual td:first-child { font-size: 12.5px; color: var(--ink); }
  .compare .good { color: var(--ok-ink); } .compare .bad { color: var(--bad); }
  .screwup-line { display: inline-flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; margin-top: 4px; padding: 5px 9px; border-radius: 6px; background: var(--mk-soft); color: var(--mk); font-size: 12.5px; }
  .screwup-line b { font-weight: 700; }
  .legend div { display: flex; align-items: center; gap: 8px; padding: 3px 0; }
  .legend i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
  .legend span:nth-child(2) { flex: 1; }
  .quote-edit { display: inline-flex; gap: 6px; align-items: center; font-size: 13px; font-weight: 400; }
  .quote-edit input { font: inherit; width: 120px; border: 1px solid #cfd5dc; border-radius: 4px; padding: 4px 6px; }

  /* ---- Split view ---- */
  .split { display: grid; grid-template-columns: 260px minmax(0, 1fr) minmax(300px, 32%); gap: 12px; align-items: start; }
  .list-head { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 12.5px; }
  .inv { padding: 9px 10px; border: 1px solid var(--line); border-radius: var(--radius); margin-bottom: 6px; background: var(--card); cursor: pointer; }
  .inv:hover { border-color: #c5ccd4; }
  .inv.sel { background: var(--accent-soft); border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  .inv .r1, .inv .r2 { display: flex; justify-content: space-between; gap: 8px; align-items: center; }
  .inv .r1 b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .inv .r2 { margin-top: 2px; font-size: 12px; color: var(--muted); }
  .inv .r2 span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .inv .r2 > span:last-child { display: flex; gap: 4px; flex-shrink: 0; }
  .pill { display: inline-block; font-size: 11px; font-weight: 600; padding: 1px 8px; border-radius: 999px; white-space: nowrap; }
  .pill.paid { background: var(--ok-soft); color: var(--ok-ink); } .pill.part { background: var(--warn-soft); color: var(--warn); }
  .pill.unpaid { background: var(--bad-soft); color: var(--bad); } .pill.proc { background: var(--accent-soft); color: #2a5db0; }
  .pill.err { background: var(--bad-soft); color: var(--bad); } .pill.dup { background: #eef0f3; color: var(--muted); }
  .drop { display: block; border: 2px dashed #cfd5dc; border-radius: var(--radius); padding: 12px; text-align: center; color: var(--muted); cursor: pointer; margin-top: 8px; }
  .drop:hover, .drop.over { border-color: var(--accent); background: var(--accent-soft); color: #2a5db0; }
  .email { margin-top: 8px; }
  .email .row { display: flex; gap: 6px; margin-top: 4px; }
  .email code { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; background: #fff; border: 1px solid var(--line); border-radius: 4px; padding: 6px 7px; font-size: 11.5px; }

  .detail { padding: 14px; min-height: 300px; }
  .d-head { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; flex-wrap: wrap; }
  .d-head h2 { font-size: 16px; margin: 0; }
  table { width: 100%; border-collapse: collapse; margin-top: 10px; }
  th { text-align: left; font-size: 11.5px; color: var(--muted); font-weight: 500; padding: 6px 4px; border-bottom: 1px solid var(--line); }
  td { padding: 5px 4px; border-bottom: 1px solid #f0f2f5; vertical-align: middle; }
  tr.is-paid td.desc input { color: var(--muted); text-decoration: line-through; }
  tr.is-mistake td { background: var(--mk-row); }
  .mk-link { border: 0; background: none; color: var(--muted); font-size: 11.5px; padding: 0 4px; opacity: .65; }
  .mk-link:hover { color: var(--mk); opacity: 1; background: none; }
  select.mk-select { width: auto !important; max-width: 100%; font-size: 11.5px !important; padding: 1px 4px !important; margin: 1px 0 0 2px; border: 1px solid #f3b4c0 !important; border-radius: 10px !important; background: var(--mk-soft) !important; color: var(--mk) !important; font-weight: 600; }
  .pill.mk { background: var(--mk-soft); color: var(--mk); }
  select.inv-mk { font: inherit; border: 1px solid #cfd5dc; border-radius: 4px; padding: 5px 6px; background: #fff; color: var(--ink); max-width: 230px; }
  header a.btn { margin-left: auto; }
  td input[type=text], td select { font: inherit; border: 1px solid transparent; background: transparent; border-radius: 4px; padding: 3px 4px; width: 100%; color: inherit; }
  td input[type=text]:hover, td select:hover, td input[type=text]:focus, td select:focus { border-color: var(--line); background: #fff; outline: none; }
  td input.amount { text-align: right; width: 76px; }
  input[type=checkbox] { width: 17px; height: 17px; accent-color: var(--ok); cursor: pointer; }
  .d-total { text-align: right; color: var(--muted); margin-top: 8px; }
  .d-total b { color: var(--ink); }
  .note { margin-top: 10px; padding: 8px 10px; border-radius: 6px; font-size: 12.5px; background: var(--warn-soft); color: var(--warn); }
  .note.bad { background: var(--bad-soft); color: var(--bad); }
  .note.info { background: var(--accent-soft); color: #2a5db0; }
  .actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; align-items: center; }
  .actions .spacer { flex: 1; }
  .confirm-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 10px; padding: 8px 10px; background: var(--bad-soft); color: var(--bad); border-radius: 6px; font-weight: 500; }
  .confirm-bar .spacer { flex: 1; }
  .edit-form { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)) auto; gap: 8px; align-items: end; margin-top: 10px; padding: 10px; background: var(--bg); border-radius: 6px; }
  .edit-form label { font-size: 12px; color: var(--muted); display: grid; gap: 3px; }
  .edit-form input { font: inherit; border: 1px solid #cfd5dc; border-radius: 4px; padding: 5px 7px; width: 100%; }
  .edit-form .btns { display: flex; gap: 6px; }

  .preview { height: calc(100vh - 210px); min-height: 420px; display: flex; flex-direction: column; overflow: hidden; position: sticky; top: 10px; }
  .preview .p-bar { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 7px 10px; border-bottom: 1px solid var(--line); font-size: 12px; color: var(--muted); }
  .preview .p-bar span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .preview iframe { flex: 1; border: 0; width: 100%; background: #525659; }
  .preview .img { flex: 1; overflow: auto; background: #525659; display: flex; align-items: flex-start; justify-content: center; padding: 10px; }
  .preview .img img { max-width: 100%; background: #fff; }
  .empty { text-align: center; color: var(--muted); padding: 40px 14px; }
  .toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 8px 14px; border-radius: 6px; font-size: 13px; opacity: 0; transition: .2s; pointer-events: none; z-index: 10; }
  .toast.show { opacity: 1; }
  .spin { display: inline-block; width: 11px; height: 11px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin .8s linear infinite; vertical-align: -2px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .only-sm { display: none !important; }

  @media (max-width: 1100px) {
    .split { grid-template-columns: 260px minmax(0, 1fr); }
    .preview { display: none; }
    .only-sm { display: inline-flex !important; }
  }
  @media (max-width: 760px) {
    .wrap { padding: 10px; }
    .summary { grid-template-columns: minmax(0, 1fr); }
    .split { grid-template-columns: minmax(0, 1fr); }
    .hide-sm { display: none; }
    .edit-form { grid-template-columns: minmax(0, 1fr); }
    .s-margin { text-align: left; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header><h1>Job Costs</h1><span class="sub" id="jobLabel"></span><a class="btn" id="reportsLink" target="_blank" rel="noopener">Reports ↗</a></header>
  <section class="panel summary" id="summary"></section>
  <section class="split">
    <aside>
      <div class="list-head" id="listHead"></div>
      <div id="list"></div>
      <label class="drop" id="drop">
        <input type="file" id="fileInput" multiple accept="application/pdf,image/*" hidden>
        <strong>Drop invoices here</strong><br>or click to choose files
      </label>
      <div class="email" id="emailBox"></div>
    </aside>
    <main class="panel detail" id="detail"></main>
    <section class="panel preview" id="preview"></section>
  </section>
</div>
<div class="toast" id="toast"></div>

<script>
const BOOT = /*__BOOT__*/null;
const state = { mkOpen: null, data: null, selected: null, pollTimer: null, confirmDel: null, editing: null, draft: {}, editQuote: false, previewKey: null };
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const money = (n) => (Number(n) || 0).toLocaleString('en-AU', { style: 'currency', currency: 'AUD' });
const fmtDate = (d) => d ? new Date(d + 'T00:00:00').toLocaleDateString('en-AU', { day: 'numeric', month: 'short', year: 'numeric' }) : '';
const CAT_LABEL = { materials: 'Materials', subcontractor: 'Subcontractor', labour: 'Labour', equipment_hire: 'Equipment hire', freight: 'Freight', fees: 'Fees', other: 'Other' };
const CAT_COLOR = { materials: '#4a86e8', subcontractor: '#7c3aed', labour: '#0d9488', equipment_hire: '#d97706', freight: '#0891b2', fees: '#94a3b8', other: '#64748b' };
const fileUrl = (inv) => `/api/invoices/${inv.id}/file?t=${encodeURIComponent(BOOT.token)}`;

function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 2200); }

async function api(path, opts = {}) {
  const isJson = opts.body && !(opts.body instanceof FormData);
  const res = await fetch('/api' + path, { ...opts, headers: { Authorization: 'Bearer ' + BOOT.token, ...(isJson ? { 'Content-Type': 'application/json' } : {}) } });
  const body = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(body.error || 'Request failed');
  return body;
}

async function load() {
  try {
    state.data = await api('/job');
    const ids = state.data.invoices.map((i) => i.id);
    if (!ids.includes(state.selected)) state.selected = ids[0] ?? null;
    render();
  } catch (e) { toast(e.message); }
  clearTimeout(state.pollTimer);
  if (state.data && state.data.totals.processing > 0) state.pollTimer = setTimeout(load, 3000);
}

const selectedInvoice = () => state.data?.invoices.find((i) => i.id === state.selected) || null;

function render() {
  const j = state.data.job || {};
  $('#jobLabel').textContent = [j.job_number ? 'Job #' + j.job_number : '', j.job_title].filter(Boolean).join(' · ');
  // Don't redraw a part of the screen while someone is typing in it.
  const typingIn = (el) => el.contains(document.activeElement) && document.activeElement.matches('input[type=text], input:not([type]), select');
  if (!typingIn($('#summary'))) renderSummary();
  renderList();
  if (!typingIn($('#detail'))) renderDetail();
  renderPreview();
}

// ---------- Costs vs quoted price, with and without screw-ups ----------
const REASON_LABEL = Object.fromEntries(BOOT.reasons.map((r) => [r.code, r.label]));
const MK_COLOR = '#be123c';

function renderSummary() {
  const t = state.data.totals;
  const hasQuote = t.quote != null;
  const over = hasQuote && t.total > t.quote;

  // Bar: normal costs by type, then screw-ups in red.
  const clean = {};
  for (const inv of state.data.invoices) {
    if (inv.status !== 'ready' || inv.duplicate_of) continue;
    for (const it of inv.items) if (!it.mistake_reason) clean[it.category] = (clean[it.category] || 0) + it.cost;
  }
  const cats = Object.entries(clean).filter(([, v]) => v > 0.004).sort((x, y) => y[1] - x[1]);
  const scale = Math.max(t.quote || 0, t.total) || 1;
  const segs = cats.map(([c, v]) => `<span title="${esc(CAT_LABEL[c] || c)}: ${money(v)}" style="width:${v / scale * 100}%;background:${CAT_COLOR[c] || '#64748b'}"></span>`).join('')
    + (t.mistakes > 0 ? `<span title="Screw-ups: ${money(t.mistakes)}" style="width:${t.mistakes / scale * 100}%;background:repeating-linear-gradient(135deg,${MK_COLOR} 0 6px,#e11d48 6px 12px)"></span>` : '');
  const mark = over ? `<i class="quote-mark" style="left:calc(${t.quote / scale * 100}% - 1px)" title="Quoted price ${money(t.quote)}"></i>` : '';

  let quotePart;
  if (state.editQuote || !hasQuote) {
    quotePart = `<span class="quote-edit"><span class="muted">Quoted price</span><input id="quoteInput" inputmode="decimal" placeholder="e.g. 2640.00" value="${hasQuote ? Number(t.quote).toFixed(2) : ''}"><button class="primary" data-save-quote>Save</button>${state.editQuote ? '<button data-cancel-quote>Cancel</button>' : ''}</span>`;
  } else {
    const src = state.data.job.quote_source === 'manual' ? 'typed in' : 'from ServiceM8';
    quotePart = `<span class="muted">Quoted price</span> <b>${money(t.quote)}</b> <button class="link" data-edit-quote title="Quoted price ${src}">edit</button>`;
  }
  const profitCell = (m, pct) => !hasQuote ? '<td class="muted">—</td><td class="muted">—</td>'
    : `<td class="${m < 0 ? 'bad' : 'good'}">${m < 0 ? '−' : ''}${money(Math.abs(m))}</td><td class="${m < 0 ? 'bad' : 'good'}">${pct}%</td>`;
  const hasMk = t.mistakes > 0;
  const lostPts = hasQuote && t.quote ? Math.round(t.mistakes / t.quote * 1000) / 10 : null;

  $('#summary').innerHTML = `
    <div>
      <div class="s-top"><div>${quotePart}</div>
        <div class="muted" style="font-size:12px">All amounts incl. GST</div></div>
      <table class="compare">
        <thead><tr><th></th><th class="muted">Costs</th><th class="muted">Profit</th><th class="muted">Margin</th></tr></thead>
        <tbody>
          <tr class="actual"><td>Actual</td><td>${money(t.total)}</td>${profitCell(t.margin, t.marginPct)}</tr>
          ${hasMk ? `<tr><td>Without screw-ups</td><td>${money(t.cleanTotal)}</td>${profitCell(t.cleanMargin, t.cleanMarginPct)}</tr>` : ''}
        </tbody>
      </table>
      ${!hasQuote ? '<div class="muted" style="font-size:12px">Add the quoted price to see profit and margin.</div>' : ''}
      ${hasMk ? `<div class="screwup-line">⚠ <span>Screw-ups <b>${money(t.mistakes)}</b></span><span><b>${t.mistakePct}%</b> of costs</span>${lostPts != null ? `<span>cost you <b>${lostPts}</b> margin points</span>` : ''}<span>${state.data.byReason.map((r) => `${esc(REASON_LABEL[r.name] || r.name)} ${money(r.total)}`).join(' · ')}</span></div>` : ''}
      <div class="bar">${segs}${mark}</div>
      <div class="s-foot">
        <span>Paid <b style="color:var(--ok-ink)">${money(t.paid)}</b></span>
        <span>To pay <b style="color:var(--warn)">${money(t.outstanding)}</b></span>
        <span>GST incl. <b>${money(t.tax)}</b></span>
        <span>${t.invoiceCount} invoice${t.invoiceCount === 1 ? '' : 's'}${t.processing ? ` · <span class="spin"></span> ${t.processing} reading` : ''}</span>
        ${hasQuote && !over ? '<span>Grey = left over from the quote</span>' : ''}${over ? '<span>Black line = quoted price</span>' : ''}
      </div>
    </div>
    <div class="legend">${cats.length || hasMk ? cats.map(([c, v]) => `<div><i style="background:${CAT_COLOR[c] || '#64748b'}"></i><span>${esc(CAT_LABEL[c] || c)}</span><span class="num">${money(v)}</span></div>`).join('')
      + (hasMk ? `<div style="color:var(--mk)"><i style="background:${MK_COLOR}"></i><span>Screw-ups</span><span class="num">${money(t.mistakes)}</span></div>` : '')
      : '<div class="muted">Costs by type will show here.</div>'}</div>`;
}

// ---------- Invoice list ----------
function statusPill(inv) {
  if (inv.status === 'processing') return '<span class="pill proc"><span class="spin"></span> Reading</span>';
  if (inv.status === 'error') return '<span class="pill err">Needs attention</span>';
  if (inv.duplicate_of) return '<span class="pill dup">Duplicate</span>';
  return { paid: '<span class="pill paid">Paid</span>', part: '<span class="pill part">Part paid</span>', unpaid: '<span class="pill unpaid">Unpaid</span>' }[inv.payment_state];
}

function renderList() {
  const d = state.data;
  $('#listHead').innerHTML = `<b>Invoices</b><span class="muted">${money(d.totals.outstanding)} to pay</span>`;
  $('#list').innerHTML = d.invoices.length ? d.invoices.map((inv) => {
    const ready = inv.status === 'ready';
    const sub = [inv.invoice_number ? '#' + inv.invoice_number : '', inv.invoice_date ? fmtDate(inv.invoice_date) : ''].filter(Boolean).join(' · ') || (inv.source === 'email' ? 'Emailed' : 'Uploaded');
    return `<div class="inv ${inv.id === state.selected ? 'sel' : ''}" data-select="${inv.id}">
      <div class="r1"><b>${esc(ready ? (inv.supplier || 'Unknown supplier') : (inv.file_name || 'Invoice'))}</b><span class="num">${ready ? money(inv.total) : ''}</span></div>
      <div class="r2"><span>${esc(sub)}</span><span>${inv.mistake_state !== 'none' && inv.mistake_state ? '<span class="pill mk" title="Screw-up">⚠</span> ' : ''}${statusPill(inv)}</span></div>
    </div>`;
  }).join('') : '<div class="panel empty">No invoices yet.</div>';

  $('#emailBox').innerHTML = d.inboxAddress
    ? `<span class="muted">Or email invoices to this job:</span><div class="row"><code id="inbox">${esc(d.inboxAddress)}</code><button data-copy>Copy</button></div>`
    : '<span class="muted">Email-in is not set up on the server yet.</span>';
}

// ---------- Selected invoice ----------
function renderDetail() {
  const inv = selectedInvoice();
  const el = $('#detail');
  if (!inv) { el.innerHTML = '<div class="empty">Drop an invoice on the left, or email it to this job.<br>It is read automatically and appears here.</div>'; return; }
  const ready = inv.status === 'ready';
  const meta = [inv.invoice_number ? '#' + inv.invoice_number : '', inv.invoice_date ? fmtDate(inv.invoice_date) : '', inv.due_date && inv.payment_state !== 'paid' ? 'due ' + fmtDate(inv.due_date) : '', inv.source === 'email' ? 'Emailed' : 'Uploaded'].filter(Boolean).join(' · ');
  const allPaid = inv.payment_state === 'paid';
  let h = `<div class="d-head"><div><h2>${esc(ready ? (inv.supplier || 'Unknown supplier') : (inv.file_name || 'Invoice'))} ${statusPill(inv)}</h2><div class="muted">${esc(meta)}</div></div>
    ${ready && inv.items.length ? `<button data-inv-paid="${inv.id}" data-value="${allPaid ? 'false' : 'true'}">${allPaid ? 'Mark unpaid' : 'Mark all paid'}</button>` : ''}</div>`;
  if (inv.status === 'processing') h += '<div class="note info"><span class="spin"></span> Reading this invoice…</div>';
  if (inv.duplicate_of) h += '<div class="note">This looks like a duplicate of another invoice on this job (same supplier and invoice number). It is not counted in the totals.</div>';
  if (inv.status === 'error') h += `<div class="note bad">${esc(inv.error)}</div>`;
  if (inv.items.length) {
    h += `<table><thead><tr><th style="width:30px">Paid</th><th>Item</th><th class="hide-sm" style="width:112px">Type</th><th class="num hide-sm">On invoice</th><th class="num">Cost to job</th></tr></thead><tbody>`;
    for (const it of inv.items) {
      const qty = it.quantity != null ? `Qty ${it.quantity}${it.unit ? ' ' + it.unit : ''}` : '';
      const mk = it.mistake_reason
        ? `<select class="mk-select" data-item-mk="${it.id}" title="Screw-up reason"><option value="">✕ Not a screw-up</option>${BOOT.reasons.map((r) => `<option value="${r.code}" ${r.code === it.mistake_reason ? 'selected' : ''}>⚠ ${esc(r.label)}</option>`).join('')}</select>`
        : state.mkOpen === it.id
          ? `<select class="mk-select" data-item-mk="${it.id}" data-autofocus><option value="">Why was this a screw-up?</option>${BOOT.reasons.map((r) => `<option value="${r.code}">${esc(r.label)}</option>`).join('')}</select> <button class="mk-link" data-mk-cancel>cancel</button>`
          : `<button class="mk-link" data-mk-open="${it.id}">⚠ Mark as screw-up</button>`;
      h += `<tr class="${it.paid ? 'is-paid' : ''} ${it.mistake_reason ? 'is-mistake' : ''}">
        <td><input type="checkbox" data-item-paid="${it.id}" ${it.paid ? 'checked' : ''}></td>
        <td class="desc"><input type="text" value="${esc(it.description)}" data-item-desc="${it.id}" title="${esc(qty)}"><div>${mk}</div></td>
        <td class="hide-sm"><select data-item-cat="${it.id}">${BOOT.categories.map((c) => `<option value="${c}" ${c === it.category ? 'selected' : ''}>${CAT_LABEL[c] || c}</option>`).join('')}</select></td>
        <td class="num hide-sm"><input type="text" class="amount" inputmode="decimal" value="${(Number(it.line_total) || 0).toFixed(2)}" data-item-amt="${it.id}"></td>
        <td class="num">${money(it.cost)}</td></tr>`;
    }
    h += '</tbody></table>';
    h += `<div class="d-total">${inv.subtotal != null ? 'Subtotal ' + money(inv.subtotal) + ' · ' : ''}${inv.tax != null ? 'GST ' + money(inv.tax) + ' · ' : ''}<b>Total ${money(inv.total)}</b>${inv.payment_state === 'part' ? ` · <span style="color:var(--warn)">${money(inv.outstanding)} to pay</span>` : ''}</div>`;
  }
  if (inv.notes) h += `<div class="note">${esc(inv.notes)}</div>`;
  if (inv.email_from) h += `<div class="muted" style="margin-top:10px">Emailed by ${esc(inv.email_from)}${inv.email_subject ? ' — “' + esc(inv.email_subject) + '”' : ''}</div>`;
  h += `<div class="actions">
      ${inv.file_path ? `<a class="btn only-sm" href="${fileUrl(inv)}" target="_blank" rel="noopener">View invoice</a>` : ''}
      <button data-reread="${inv.id}">Read again</button>
      ${ready && inv.items.length ? `<select class="inv-mk" data-inv-mk="${inv.id}"><option value="__">⚠ ${inv.mistake_state === 'all' ? 'Change screw-up reason' : 'Whole invoice is a screw-up'}…</option>${BOOT.reasons.map((r) => `<option value="${r.code}">${esc(r.label)}</option>`).join('')}${inv.mistake_state !== 'none' ? '<option value="">✕ Clear screw-up tags</option>' : ''}</select>` : ''}
      ${ready && state.editing !== inv.id ? `<button data-edit="${inv.id}">Edit supplier / total</button>` : ''}
      <span class="spacer"></span>
      <button class="danger link" data-ask-delete="${inv.id}">Remove</button>
    </div>`;
  if (state.confirmDel === inv.id) h += `<div class="confirm-bar">Remove this invoice from the job?<span class="spacer"></span><button class="solid-danger" data-delete="${inv.id}">Remove</button><button data-cancel>Cancel</button></div>`;
  if (state.editing === inv.id) {
    const dr = state.draft;
    h += `<form class="edit-form" data-edit-form="${inv.id}">
      <label>Supplier<input name="supplier" value="${esc(dr.supplier ?? inv.supplier ?? '')}"></label>
      <label>Invoice number<input name="invoice_number" value="${esc(dr.invoice_number ?? inv.invoice_number ?? '')}"></label>
      <label>Total incl. GST<input name="total" inputmode="decimal" value="${esc(dr.total ?? (inv.total != null ? Number(inv.total).toFixed(2) : ''))}"></label>
      <div class="btns"><button type="submit" class="primary">Save</button><button type="button" data-cancel>Cancel</button></div>
    </form>`;
  }
  el.innerHTML = h;
}

// ---------- Original invoice (only reloads when a different file is selected) ----------
function renderPreview() {
  const inv = selectedInvoice();
  const key = inv && inv.file_path ? String(inv.id) : 'none';
  if (key === state.previewKey) return;
  state.previewKey = key;
  const el = $('#preview');
  if (key === 'none') { el.innerHTML = '<div class="empty">The original invoice shows here.</div>'; return; }
  const url = fileUrl(inv);
  const mime = inv.mime_type || '';
  const body = mime.startsWith('image/') ? `<div class="img"><img src="${url}" alt="Invoice"></div>` : `<iframe src="${url}${mime === 'application/pdf' ? '#view=FitH' : ''}" title="Invoice"></iframe>`;
  el.innerHTML = `<div class="p-bar"><span>${esc(inv.file_name || 'Invoice')}</span><a class="btn" href="${url}" target="_blank" rel="noopener">Open</a></div>${body}`;
}

// ---------- Events ----------
document.addEventListener('click', async (e) => {
  const t = e.target.closest('button, [data-select]');
  if (!t) return;
  const ds = t.dataset;
  try {
    if (ds.select) { state.selected = Number(ds.select); state.confirmDel = null; state.editing = null; state.draft = {}; return render(); }
    if (ds.copy !== undefined) {
      const text = $('#inbox').textContent;
      try { await navigator.clipboard.writeText(text); }
      catch { const r = document.createRange(); r.selectNodeContents($('#inbox')); getSelection().removeAllRanges(); getSelection().addRange(r); document.execCommand('copy'); }
      return toast('Email address copied');
    }
    if (ds.editQuote !== undefined) { state.editQuote = true; renderSummary(); return $('#quoteInput')?.focus(); }
    if (ds.cancelQuote !== undefined) { state.editQuote = false; return renderSummary(); }
    if (ds.saveQuote !== undefined) return saveQuote();
    if (ds.reread) { await api(`/invoices/${ds.reread}/reanalyze`, { method: 'POST' }); toast('Reading again…'); return load(); }
    if (ds.invPaid) { await api(`/invoices/${ds.invPaid}`, { method: 'PATCH', body: JSON.stringify({ paid: ds.value === 'true' }) }); toast(ds.value === 'true' ? 'Invoice marked paid' : 'Invoice marked unpaid'); return load(); }
    if (ds.askDelete) { state.confirmDel = Number(ds.askDelete); return renderDetail(); }
    if (ds.cancel !== undefined) { state.confirmDel = null; state.editing = null; state.draft = {}; return renderDetail(); }
    if (ds.delete) { await api(`/invoices/${ds.delete}`, { method: 'DELETE' }); toast('Invoice removed'); state.confirmDel = null; state.selected = null; return load(); }
    if (ds.edit) { state.editing = Number(ds.edit); state.draft = {}; return renderDetail(); }
    if (ds.mkOpen) { state.mkOpen = Number(ds.mkOpen); renderDetail(); const sel = $('#detail [data-autofocus]'); sel?.focus(); try { sel?.showPicker(); } catch {} return; }
    if (ds.mkCancel !== undefined) { state.mkOpen = null; return renderDetail(); }
  } catch (x) { toast(x.message); load(); }
});

async function saveQuote() {
  const input = $('#quoteInput');
  const v = (input?.value || '').trim();
  try {
    await api('/job', { method: 'PATCH', body: JSON.stringify({ quote_amount: v === '' ? null : v }) });
    state.editQuote = false; toast(v === '' ? 'Quoted price cleared' : 'Quoted price saved');
  } catch (x) { toast(x.message); }
  input?.blur(); load();
}
document.addEventListener('keydown', (e) => { if (e.key === 'Enter' && e.target.id === 'quoteInput') { e.preventDefault(); saveQuote(); } });

$('#detail').addEventListener('submit', async (e) => {
  const f = e.target.closest('form[data-edit-form]'); if (!f) return;
  e.preventDefault();
  const v = Object.fromEntries(new FormData(f));
  try {
    await api(`/invoices/${f.dataset.editForm}`, { method: 'PATCH', body: JSON.stringify({ supplier: v.supplier, invoice_number: v.invoice_number, total: String(v.total).replace(/[$,\s]/g, '') }) });
    state.editing = null; state.draft = {}; toast('Saved');
  } catch (x) { toast(x.message); }
  document.activeElement?.blur(); load();
});
$('#detail').addEventListener('input', (e) => { if (e.target.closest('form[data-edit-form]')) state.draft[e.target.name] = e.target.value; });
$('#detail').addEventListener('change', async (e) => {
  const t = e.target;
  if (t.closest('form[data-edit-form]')) return;
  try {
    if (t.dataset.itemPaid) await api(`/items/${t.dataset.itemPaid}`, { method: 'PATCH', body: JSON.stringify({ paid: t.checked }) });
    else if (t.dataset.itemDesc) await api(`/items/${t.dataset.itemDesc}`, { method: 'PATCH', body: JSON.stringify({ description: t.value }) });
    else if (t.dataset.itemCat) await api(`/items/${t.dataset.itemCat}`, { method: 'PATCH', body: JSON.stringify({ category: t.value }) });
    else if (t.dataset.itemMk) { await api(`/items/${t.dataset.itemMk}`, { method: 'PATCH', body: JSON.stringify({ mistake_reason: t.value || null }) }); state.mkOpen = null; toast(t.value ? 'Tagged as screw-up' : 'Screw-up tag removed'); }
    else if (t.dataset.invMk) {
      if (t.value === '__') return;
      await api(`/invoices/${t.dataset.invMk}`, { method: 'PATCH', body: JSON.stringify({ mistake_reason: t.value || null }) });
      toast(t.value ? 'Whole invoice tagged as screw-up' : 'Screw-up tags cleared');
    }
    else if (t.dataset.itemAmt) await api(`/items/${t.dataset.itemAmt}`, { method: 'PATCH', body: JSON.stringify({ line_total: t.value.replace(/[$,\s]/g, '') }) });
    else return;
  } catch (x) { toast(x.message); }
  t.blur(); load();
});

async function uploadFiles(files) {
  if (!files.length) return;
  const fd = new FormData();
  [...files].forEach((f) => fd.append('files', f));
  toast(`Uploading ${files.length} file${files.length > 1 ? 's' : ''}…`);
  try { const r = await api('/invoices', { method: 'POST', body: fd }); state.selected = r.created[0]; } catch (x) { toast(x.message); }
  load();
}
const drop = $('#drop');
$('#fileInput').addEventListener('change', (e) => { uploadFiles(e.target.files); e.target.value = ''; });
['dragenter', 'dragover'].forEach((ev) => drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.add('over'); }));
['dragleave', 'drop'].forEach((ev) => drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.remove('over'); }));
drop.addEventListener('drop', (e) => uploadFiles(e.dataTransfer.files));

$('#reportsLink').href = '/report?t=' + encodeURIComponent(BOOT.token);
if (BOOT.embedded && window.SMClient) {
  try { window.SMClient.init().resizeWindow(1300, 820); } catch (e) { /* not inside ServiceM8 */ }
}
load();
</script>
</body>
</html>
