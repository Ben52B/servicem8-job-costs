<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prices &amp; rules</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f4f7f6; --card: #fff; --ink: #17312b; --muted: #6b8a82; --line: #e3ece9; --line2: #f0f5f3;
    --brand: #10b981; --brand-dark: #059669; --brand-soft: #e7f8f1; --warn: #b45309; --warn-soft: #fef3c7;
    --bad: #be123c; --bad-soft: #ffe4e6; --sun: #f97316;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 13.5px/1.45 "Plus Jakarta Sans", "Segoe UI", -apple-system, Roboto, Arial, sans-serif; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 18px 16px; }
  header { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-bottom: 6px; }
  header h1 { margin: 0; font-size: 22px; font-weight: 800; }
  .muted { color: var(--muted); }
  .badge { display: inline-flex; align-items: center; justify-content: center; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px; background: var(--sun); color: #fff; font-size: 11px; font-weight: 800; }
  button, .btn { font: inherit; font-weight: 600; border: 1px solid #d6e2de; background: #fff; color: var(--ink); border-radius: 10px; padding: 6px 12px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
  button.primary { background: var(--brand); border-color: var(--brand); color: #fff; box-shadow: 0 4px 12px rgba(16, 185, 129, .28); }
  button.danger { color: var(--bad); }
  select { font: inherit; border: 1px solid #d6e2de; border-radius: 10px; padding: 6px 8px; background: #fff; color: var(--ink); max-width: 260px; }
  .address { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 4px 0 18px; padding: 12px 14px; background: var(--card); border: 1px solid var(--line); border-radius: 16px; }
  .address code { background: var(--brand-soft); color: var(--brand-dark); padding: 5px 10px; border-radius: 8px; font-size: 13px; }
  h2 { font-size: 15px; margin: 20px 0 8px; display: flex; align-items: center; gap: 8px; }
  .item { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; margin-bottom: 8px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: center; }
  .item .t { font-weight: 700; font-size: 14px; }
  .item .sub { font-size: 12px; color: var(--muted); }
  .acts { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; align-items: center; }
  .chip { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 700; padding: 2px 9px; border-radius: 20px; white-space: nowrap; }
  .c-sugg { background: var(--warn-soft); color: #92400e; } .c-dup { background: #f1f5f9; color: #64748b; } .c-err { background: var(--bad-soft); color: var(--bad); } .c-proc { background: var(--brand-soft); color: var(--brand-dark); }
  .trace { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 5px; font-size: 11.5px; }
  .trace span { padding: 1px 8px; border-radius: 10px; background: #f0fdf4; color: #166534; }
  .trace span.left { background: var(--warn-soft); color: #92400e; }
  .trace span.dup { background: var(--bad-soft); color: var(--bad); }
  .lnk, .acts .lnk { background: none; border: 0; padding: 4px 6px; color: var(--brand-dark); text-decoration: underline; box-shadow: none; }
  .recent .item { background: #fbfdfc; }
  .empty { text-align: center; color: var(--muted); padding: 26px; background: var(--card); border: 1px dashed var(--line); border-radius: 16px; }
  .spin { display: inline-block; width: 11px; height: 11px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin .8s linear infinite; vertical-align: -2px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 9px 16px; border-radius: 12px; font-weight: 600; opacity: 0; transition: .2s; pointer-events: none; }
  .toast.show { opacity: 1; }
  @media (max-width: 720px) { .item { grid-template-columns: minmax(0, 1fr); } .acts { justify-content: flex-start; } }
</style>
<style>
  .grid2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px; align-items: start; }
  @media (max-width: 900px) { .grid2 { grid-template-columns: minmax(0, 1fr); } }
  .panel { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; margin-bottom: 14px; }
  .panel h2 { margin: 0 0 4px; }
  .panel .hint { color: var(--muted); font-size: 12.5px; margin-bottom: 10px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 8px; }
  input[type=text], input[type=date], textarea { font: inherit; border: 1px solid #d6e2de; border-radius: 10px; padding: 7px 10px; background: #fff; color: var(--ink); }
  textarea { width: 100%; min-height: 64px; resize: vertical; }
  .rule { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 8px; align-items: start; padding: 8px 0; border-top: 1px solid var(--line2); }
  .rule.off .txt { color: var(--muted); text-decoration: line-through; }
  .rule .txt { white-space: pre-wrap; cursor: text; }
  .lnk { background: none; border: 0; padding: 0 1px; color: var(--brand-dark); text-decoration: underline; cursor: pointer; font: inherit; font-weight: 700; box-shadow: none; }
  table.t { width: 100%; border-collapse: collapse; }
  table.t th { text-align: left; font-size: 11.5px; color: var(--muted); font-weight: 700; padding: 8px; border-bottom: 1px solid var(--line); }
  table.t td { padding: 8px; border-bottom: 1px solid var(--line2); vertical-align: top; }
  .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .v-ok { background: var(--brand-soft); color: var(--brand-dark); } .v-check { background: var(--warn-soft); color: #92400e; }
  .v-problem { background: var(--bad-soft); color: var(--bad); } .v-missing { background: #f1f5f9; color: #475569; }
  .v-done { background: var(--brand-soft); color: var(--brand-dark); } .v-error { background: var(--bad-soft); color: var(--bad); } .v-reading, .v-checking { background: var(--warn-soft); color: #92400e; } .v-waiting { background: #eef2ff; color: #3730a3; }
  .money { border-radius: 14px; padding: 10px 14px; margin-bottom: 10px; font-size: 13.5px; }
  .money.ok { background: var(--brand-soft); color: var(--brand-dark); border: 1px solid #b7ebd6; }
  .money.bad { background: var(--bad-soft); color: var(--bad); border: 1px solid #fecdd3; }
  .money ul { margin: 6px 0 0; padding-left: 18px; }
  .bottom { font-size: 15px; line-height: 1.5; background: #f0fdf7; border: 1px solid #c8eedd; border-radius: 14px; padding: 12px 14px; }
  .kpis { display: flex; gap: 10px; flex-wrap: wrap; margin: 12px 0; }
  .kpi { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 8px 14px; min-width: 110px; }
  .kpi b { display: block; font-size: 20px; }
  tr.detail td { background: #fbfdfc; font-size: 13px; }
  tr.detail .lbl { color: var(--muted); font-weight: 700; font-size: 11.5px; text-transform: uppercase; letter-spacing: .3px; }
  tr.main { cursor: pointer; }
  ol.actions { margin: 6px 0 0; padding-left: 20px; } ol.actions li { margin: 4px 0; }
</style>
<style>
  /* Prices page: the price-list table needs room, so the two panels stack below 1250px */
  @media (max-width: 1250px) { .grid2 { grid-template-columns: minmax(0, 1fr); } }
  table.t td { overflow-wrap: anywhere; }
</style>
</head>
<body>
<div class="wrap">
  <header><a class="btn" href="#" onclick="location.href='/card?t='+encodeURIComponent(BOOT.token);return false" style="margin-right:4px">← Back to job</a><h1>💲 Prices &amp; rules</h1><span class="muted">Your suppliers' and subcontractors' price lists, and the agreements to apply</span></header>
  <div id="content"><div class="empty"><span class="spin"></span></div></div>
</div>
<div class="toast" id="toast"></div>
<script>
const BOOT = /*__BOOT__*/null;
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmtDate = (d) => d ? new Date(String(d).slice(0, 10) + 'T00:00:00').toLocaleDateString('en-AU', { day: 'numeric', month: 'short', year: 'numeric' }) : '';
function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 3000); }
async function api(path, opts = {}) {
  const isForm = opts.body instanceof FormData;
  const res = await fetch('/api' + path, { ...opts, headers: { Authorization: 'Bearer ' + BOOT.token, ...(opts.body && !isForm ? { 'Content-Type': 'application/json' } : {}) } });
  const body = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(body.error || 'Something went wrong');
  return body;
}
const T = encodeURIComponent(BOOT.token);
let data = null;
let editingRule = null;

function render() {
  const lists = data.priceLists.map((p) => `<tr><td><b>${esc(p.supplier)}</b></td><td>${esc(p.name || '')}</td><td>${esc(fmtDate(p.created_at))}</td>
      <td class="num">${p.checked ? `${p.checked}${p.flagged ? ` <span class="chip v-check" title="Flagged for a look">${p.flagged} flagged</span>` : ''}` : '<span class="muted">–</span>'}</td>
      <td><a class="lnk" href="${p.mime_type === 'application/pdf' ? `/viewer.html?pl=${p.id}&t=${T}&name=${encodeURIComponent(p.name || 'Price list')}` : `/api/price-lists/${p.id}/file?t=${T}`}" target="_blank" rel="noopener">View</a></td>
      <td><button class="danger" data-pl-del="${p.id}">Delete</button></td></tr>`).join('');
  const kindChip = (r) => (r.kind !== 'once' ? '<span class="chip v-done" style="font-size:10.5px">Always</span>'
    : r.used_at ? `<span class="chip v-missing" style="font-size:10.5px" title="Switched off after it was used">One time · used ${esc(fmtDate(r.used_at))}${r.used_on ? ' on ' + esc(r.used_on) : ''}</span>`
    : `<span class="chip v-waiting" style="font-size:10.5px">One time · ${r.target ? 'for ' + esc(r.target) : 'next check'}</span>`);
  const rules = data.rules.map((r) => `<div class="rule ${r.active ? '' : 'off'}">
      <input type="checkbox" data-rule-on="${r.id}" ${r.active ? 'checked' : ''} title="Use this rule">
      ${editingRule === r.id ? `<div><textarea id="ruleEdit">${esc(r.text)}</textarea><div class="row"><button class="primary" data-rule-save="${r.id}">Save</button><button data-rule-cancel>Cancel</button></div></div>`
        : `<div><div class="txt" data-rule-edit="${r.id}" title="Click to change">${esc(r.text)}</div><div style="margin-top:3px">${kindChip(r)}</div></div>`}
      <button class="danger" data-rule-del="${r.id}" title="Delete this rule">🗑</button></div>`).join('');
  $('#content').innerHTML = `${data.available ? '' : '<div class="note bad">Price checks need ANTHROPIC_API_KEY on the server.</div>'}
  <div class="grid2"><div>
    <div class="panel"><h2>Price lists</h2>
      <div class="hint">Every invoice that comes in is checked against the price list of its supplier or subcontractor: the name you give here just needs to appear in the name on their invoices (e.g. “Gliderol”, “Taurean Stramit”, “Joe’s Installs”). The same price lists are used by the Statement check. They stay private to your business.</div>
      ${lists ? `<table class="t"><thead><tr><th>Supplier / subcontractor</th><th>File</th><th>Uploaded</th><th class="num">Invoices checked</th><th></th><th></th></tr></thead><tbody>${lists}</tbody></table>` : '<div class="hint">No price lists yet.</div>'}
      <form id="newList" class="row" style="border-top:1px solid var(--line2);padding-top:10px"><input type="text" name="supplier" placeholder="Supplier or subcontractor, e.g. Gliderol" required style="width:260px"><input type="file" name="file" accept="application/pdf,image/*" required><button type="submit" class="primary">⬆ Upload price list</button></form>
      <div class="hint" style="margin-top:8px">Got a newer price list? Upload it and delete the old one, so checks use the new prices.</div></div>
  </div><div>
    <div class="panel"><h2>Rules</h2><div class="hint">Agreements and exceptions, applied first on every price check and statement check. Untick a rule to pause it.</div>
      ${rules || '<div class="hint">No rules yet.</div>'}
      <div class="row" style="display:block;border-top:1px solid var(--line2);padding-top:10px"><textarea id="newRule" placeholder="e.g. Job 207932: Gliderol said they'll bill us for 1 door only
e.g. Taurean: price list shows net prices; store delivery is now $25.68
e.g. Joe's Installs: $50 extra per door for removal is agreed"></textarea></div>
      <div class="row"><label><input type="radio" name="ruleKind" value="always" checked> Always</label>
        <label><input type="radio" name="ruleKind" value="once"> One time</label>
        <input type="text" id="ruleTarget" placeholder="for invoice no. (optional)" style="width:190px" title="A one-time rule is used once, on the next check of this invoice (or the next check at all), then switches off">
        <button class="primary" data-rule-add>＋ Add rule</button></div>
      <div class="hint" style="margin-top:6px">A <b>one-time</b> rule is used once – on the next check of that invoice number (or the next check, if you leave it empty) – then switches itself off. Tick it again to use it once more.</div></div>
    <div class="panel"><a class="btn" href="/checks?t=${T}">🔎 Statement check</a> <span class="muted" style="font-size:12.5px">checks a supplier's whole monthly statement with these price lists and rules.</span></div>
  </div></div>`;
}
async function load() {
  try { data = await api('/prices'); render(); } catch (e) { $('#content').innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
}
document.addEventListener('submit', async (e) => {
  e.preventDefault();
  const b = e.target.querySelector('button[type=submit]'); b.disabled = true;
  try { await api('/price-lists', { method: 'POST', body: new FormData(e.target) }); toast('Price list saved – new invoices from them will be checked against it'); return load(); }
  catch (x) { toast(x.message); b.disabled = false; }
});
document.addEventListener('change', async (e) => {
  if (e.target.dataset.ruleOn) { try { await api('/rules/' + e.target.dataset.ruleOn, { method: 'PATCH', body: JSON.stringify({ active: e.target.checked }) }); } catch (x) { toast(x.message); } return load(); }
});
document.addEventListener('click', async (e) => {
  const t = e.target.closest('button, [data-rule-edit]'); if (!t) return;
  const d = t.dataset;
  try {
    if (d.ruleAdd !== undefined) {
      const text = $('#newRule').value.trim();
      if (!text) { $('#newRule').focus(); return toast('Write the rule first'); }
      const kind = (document.querySelector('input[name=ruleKind]:checked') || {}).value || 'always';
      await api('/rules', { method: 'POST', body: JSON.stringify({ text, kind, target: kind === 'once' ? $('#ruleTarget').value.trim() : null }) });
      toast(kind === 'once' ? 'One-time rule added' : 'Rule added'); return load();
    }
    if (d.ruleEdit) { editingRule = Number(d.ruleEdit); render(); return $('#ruleEdit').focus(); }
    if (d.ruleCancel !== undefined) { editingRule = null; return render(); }
    if (d.ruleSave) { await api('/rules/' + d.ruleSave, { method: 'PATCH', body: JSON.stringify({ text: $('#ruleEdit').value }) }); editingRule = null; return load(); }
    if (d.ruleDel) { if (!confirm('Delete this rule?')) return; await api('/rules/' + d.ruleDel, { method: 'DELETE' }); return load(); }
    if (d.plDel) { if (!confirm('Delete this price list?')) return; await api('/price-lists/' + d.plDel, { method: 'DELETE' }); return load(); }
  } catch (x) { toast(x.message); }
});
load();
</script>
</body>
</html>
