<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Welcome to Job Costs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f4f7f6; --card: #fff; --ink: #17312b; --muted: #6b8a82; --line: #e3ece9; --line2: #f0f5f3;
    --brand: #10b981; --brand-dark: #059669; --brand-soft: #e7f8f1; --warn: #b45309; --warn-soft: #fef3c7;
    --bad: #be123c; --bad-soft: #ffe4e6; --sun: #f97316;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 13.5px/1.45 "Plus Jakarta Sans", "Segoe UI", -apple-system, Roboto, Arial, sans-serif; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 18px 16px; }
  header { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-bottom: 6px; }
  header h1 { margin: 0; font-size: 22px; font-weight: 800; }
  .muted { color: var(--muted); }
  .badge { display: inline-flex; align-items: center; justify-content: center; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px; background: var(--sun); color: #fff; font-size: 11px; font-weight: 800; }
  button, .btn { font: inherit; font-weight: 600; border: 1px solid #d6e2de; background: #fff; color: var(--ink); border-radius: 10px; padding: 6px 12px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
  button.primary { background: var(--brand); border-color: var(--brand); color: #fff; box-shadow: 0 4px 12px rgba(16, 185, 129, .28); }
  button.danger { color: var(--bad); }
  select { font: inherit; border: 1px solid #d6e2de; border-radius: 10px; padding: 6px 8px; background: #fff; color: var(--ink); max-width: 260px; }
  .address { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 4px 0 18px; padding: 12px 14px; background: var(--card); border: 1px solid var(--line); border-radius: 16px; }
  .address code { background: var(--brand-soft); color: var(--brand-dark); padding: 5px 10px; border-radius: 8px; font-size: 13px; }
  h2 { font-size: 15px; margin: 20px 0 8px; display: flex; align-items: center; gap: 8px; }
  .item { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; margin-bottom: 8px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: center; }
  .item .t { font-weight: 700; font-size: 14px; }
  .item .sub { font-size: 12px; color: var(--muted); }
  .acts { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; align-items: center; }
  .chip { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 700; padding: 2px 9px; border-radius: 20px; white-space: nowrap; }
  .c-sugg { background: var(--warn-soft); color: #92400e; } .c-dup { background: #f1f5f9; color: #64748b; } .c-err { background: var(--bad-soft); color: var(--bad); } .c-proc { background: var(--brand-soft); color: var(--brand-dark); }
  .trace { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 5px; font-size: 11.5px; }
  .trace span { padding: 1px 8px; border-radius: 10px; background: #f0fdf4; color: #166534; }
  .trace span.left { background: var(--warn-soft); color: #92400e; }
  .trace span.dup { background: var(--bad-soft); color: var(--bad); }
  .lnk, .acts .lnk { background: none; border: 0; padding: 4px 6px; color: var(--brand-dark); text-decoration: underline; box-shadow: none; }
  .recent .item { background: #fbfdfc; }
  .empty { text-align: center; color: var(--muted); padding: 26px; background: var(--card); border: 1px dashed var(--line); border-radius: 16px; }
  .spin { display: inline-block; width: 11px; height: 11px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin .8s linear infinite; vertical-align: -2px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 9px 16px; border-radius: 12px; font-weight: 600; opacity: 0; transition: .2s; pointer-events: none; }
  .toast.show { opacity: 1; }
  @media (max-width: 720px) { .item { grid-template-columns: minmax(0, 1fr); } .acts { justify-content: flex-start; } }
.move{display:inline-flex;gap:4px;align-items:center}.move input{width:90px;font:inherit;border:1px solid #d6e2de;border-radius:8px;padding:3px 6px}
.pen{border:0;background:none;cursor:pointer;color:#64748b;padding:0 2px;font-size:13px}
.dupwarn{color:#b42318;font-size:12px;font-weight:600;margin-top:3px;max-width:240px;white-space:normal}
  @media (max-width: 640px) { .wrap { padding: 12px 10px; } .panel { overflow-x: auto; } header h1 { font-size: 19px; } }
</style>
<style>
  .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 6px 0 12px; }
  .bar input[type=search] { flex: 1; min-width: 220px; font: inherit; border: 1px solid #d6e2de; border-radius: 10px; padding: 8px 12px; background: #fff; }
  .seg button { border-radius: 10px; }
  .seg button.on { background: var(--brand); color: #fff; border-color: var(--brand); }
  table.bills { width: 100%; border-collapse: collapse; background: var(--card); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
  table.bills th { text-align: left; font-size: 11.5px; color: var(--muted); font-weight: 700; padding: 9px 10px; border-bottom: 1px solid var(--line); background: #fbfdfc; }
  table.bills td { padding: 9px 10px; border-bottom: 1px solid var(--line2); vertical-align: middle; }
  table.bills tr:last-child td { border-bottom: 0; }
  table.bills tr.sel td { background: var(--brand-soft); }
  .num, table.bills th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .c-paid { background: var(--brand-soft); color: var(--brand-dark); } .c-unpaid { background: var(--bad-soft); color: var(--bad); } .c-part { background: var(--warn-soft); color: #92400e; }
  .foot { position: sticky; bottom: 0; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 12px; padding: 12px 14px; background: var(--card); border: 1px solid var(--line); border-radius: 16px; box-shadow: 0 -4px 16px rgba(16,40,34,.06); }
  .foot .spacer { flex: 1; }
  .lnk { background: none; border: 0; padding: 0 2px; color: var(--brand-dark); text-decoration: underline; cursor: pointer; font: inherit; box-shadow: none; }
</style>
<style>
  .kpis { display: flex; gap: 10px; flex-wrap: wrap; margin: 6px 0 4px; }
  .kpi { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 10px 14px; min-width: 150px; }
  .kpi .l { font-size: 11.5px; color: var(--muted); font-weight: 700; } .kpi .v { font-size: 20px; font-weight: 800; }
  .lines { margin-top: 6px; } .lines .ln { margin-top: 5px; font-size: 12.5px; }
  details.used summary { cursor: pointer; font-weight: 700; font-size: 15px; margin: 20px 0 8px; }
</style>
<style>
  .panel { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; margin-bottom: 12px; }
  .panel h2 { margin: 0 0 4px; font-size: 15px; } .hint { font-size: 12.5px; color: var(--muted); margin-bottom: 8px; }
  label.f { display: block; font-weight: 700; font-size: 12.5px; margin: 10px 0 4px; }
  input[type=text], select { font: inherit; border: 1px solid #d6e2de; border-radius: 10px; padding: 8px 10px; width: 100%; max-width: 420px; background: #fff; }
  .days { display: flex; gap: 6px; flex-wrap: wrap; } .days label { display: inline-flex; gap: 4px; align-items: center; border: 1px solid #d6e2de; border-radius: 10px; padding: 5px 9px; font-weight: 600; }
  .hours { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; } .hours select { width: auto; }
  .switch { display: flex; gap: 10px; align-items: flex-start; } .switch input { margin-top: 3px; width: 18px; height: 18px; }
  .save { position: sticky; bottom: 0; padding: 10px 0; background: var(--bg); }
  .mb { margin: 6px 0; } .choices { display: flex; gap: 8px; flex-wrap: wrap; margin: 6px 0; } .imap { margin-top: 8px; border-top: 1px solid var(--line2); padding-top: 6px; }
  input[type=password] { font: inherit; border: 1px solid #d6e2de; border-radius: 10px; padding: 8px 10px; width: 100%; max-width: 420px; background: #fff; }
  code { background: var(--brand-soft); color: var(--brand-dark); padding: 3px 8px; border-radius: 8px; font-size: 12.5px; }
  @media (max-width: 640px) { .wrap { padding: 12px 10px; } }
</style>
<style>
  .step { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 10px; }
  .num { width: 30px; height: 30px; border-radius: 50%; background: var(--brand); color: #fff; font-weight: 800; display: flex; align-items: center; justify-content: center; }
  .step.done .num { background: var(--brand-soft); color: var(--brand-dark); }
  .pl { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-top: 6px; } .pl input[type=text] { width: 200px; }
</style>
</head>
<body>
<div class="wrap">
  <header><h1>👋 Welcome to Job Costs</h1><span class="muted">Three quick steps – you can skip any of them and come back in ⚙ Settings</span></header>
  <div id="content"><div class="empty"><span class="spin"></span></div></div>
</div>
<div class="toast" id="toast"></div>
<script>
const BOOT = /*__BOOT__*/null;
// Session: the server sends a fresh token while the window is in use; links on the page and the address bar follow it.
function noteToken(res) {
  const nt = res && res.headers && res.headers.get('X-Session-Token');
  if (!nt || !BOOT || nt === BOOT.token) return;
  const oldEnc = encodeURIComponent(BOOT.token), newEnc = encodeURIComponent(nt);
  BOOT.token = nt;
  try { T = newEnc; } catch (e) { /* this page keeps no copy */ }
  document.querySelectorAll('a[href]').forEach((a) => { if (a.getAttribute('href').includes(oldEnc)) a.setAttribute('href', a.getAttribute('href').split(oldEnc).join(newEnc)); });
  if (location.search.includes(oldEnc)) history.replaceState(null, '', location.href.split(oldEnc).join(newEnc));
}
try { const u = new URL(location.href); if (BOOT && BOOT.token && u.searchParams.get('t') && u.searchParams.get('t') !== BOOT.token) { u.searchParams.set('t', BOOT.token); history.replaceState(null, '', u); } } catch (e) { /* fine */ }
if (BOOT && BOOT.home) document.querySelectorAll('[data-back]').forEach((a) => { a.textContent = '← Job Costs home'; });
setInterval(() => { if (BOOT && BOOT.token) fetch('/api/ping', { headers: { Authorization: 'Bearer ' + BOOT.token } }).then(noteToken).catch(() => {}); }, 30 * 60 * 1000);
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const money = (n) => (Number(n) || 0).toLocaleString('en-AU', { style: 'currency', currency: 'AUD' });
const fmtDate = (d) => d ? new Date(String(d).slice(0, 10) + 'T00:00:00').toLocaleDateString('en-AU', { day: 'numeric', month: 'short', year: 'numeric' }) : '';
function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 2600); }
async function api(path, opts = {}) {
  const res = await fetch('/api' + path, { ...opts, headers: { Authorization: 'Bearer ' + BOOT.token, ...(opts.body ? { 'Content-Type': 'application/json' } : {}) } });
  noteToken(res);
  const body = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(body.error || 'Something went wrong');
  return body;
}

// ---- connecting a mailbox (Outlook, or Gmail / any IMAP mailbox) ----
function mailboxHtml(d) {
  const o = d.outlook, im = d.imap;
  const ago = (t) => { if (!t) return ''; const m = Math.round((Date.now() - Date.parse(t)) / 60000); return m < 1 ? 'just now' : m < 60 ? `${m} min ago` : m < 1440 ? `${Math.round(m / 60)} h ago` : `${Math.round(m / 1440)} d ago`; };
  let h = '';
  if (o && o.connected) h += `<div class="mb">📥 Reading Outlook <b>${esc(o.email || '')}</b>${o.error ? ` <span style="color:var(--bad)">⚠ ${esc(o.error)}</span>` : ''} · <a href="/outlook/connect?t=${encodeURIComponent(BOOT.token)}" target="_blank" rel="noopener">Change</a></div>`;
  if (im) h += `<div class="mb">📧 Reading <b>${esc(im.email)}</b> <span class="muted">(${esc(im.host)}${im.last_check ? ' · checked ' + ago(im.last_check) : ''})</span>
      ${im.error ? `<div style="color:var(--bad)">⚠ ${esc(im.error)}</div>` : ''}
      <div style="margin-top:6px;display:flex;gap:6px;flex-wrap:wrap"><button data-imap-check>↻ Check now</button><button class="danger" data-imap-off>Disconnect</button></div></div>`;
  if (!(o && o.connected) && !im) {
    h += `<div class="choices">${o && o.available ? `<a class="btn" href="/outlook/connect?t=${encodeURIComponent(BOOT.token)}" target="_blank" rel="noopener">📥 Connect Outlook / Microsoft 365</a>` : ''}
      <button data-imap-open>📧 Connect Gmail or another mailbox</button></div>`;
    h += `<div id="imapForm" hidden class="imap">
      <label class="f" for="imEmail">Email address</label><input type="text" id="imEmail" autocomplete="off" placeholder="invoices@yourbusiness.com.au or you@gmail.com">
      <label class="f" for="imPass">App password</label><input type="password" id="imPass" autocomplete="new-password" placeholder="16 letters from Google, or the mailbox password">
      <div class="hint">Gmail: turn on 2-Step Verification, then make an app password at <a href="https://myaccount.google.com/apppasswords" target="_blank" rel="noopener">myaccount.google.com/apppasswords</a>. Job Costs only reads – it never changes, moves or deletes your emails.</div>
      <div id="imHostRow" hidden><label class="f" for="imHost">Incoming mail (IMAP) server</label><input type="text" id="imHost" placeholder="e.g. mail.yourdomain.com.au"></div>
      <div style="margin-top:8px"><button class="primary" data-imap-connect>Connect</button></div></div>`;
  }
  if (d.inboxAddress) h += `<div class="hint" style="margin-top:8px">Or forward invoices to your Job Costs address: <code>${esc(d.inboxAddress)}</code></div>`;
  return h;
}
async function mailboxClick(b, reload) {
  const d = b.dataset;
  if (d.imapOpen !== undefined) { const f = $('#imapForm'); f.hidden = !f.hidden; if (!f.hidden) $('#imEmail').focus(); return true; }
  if (d.imapConnect !== undefined) {
    b.disabled = true; b.textContent = 'Checking…';
    try {
      const r = await api('/imap', { method: 'POST', body: JSON.stringify({ email: $('#imEmail').value, password: $('#imPass').value, host: $('#imHost').value }) });
      toast(`Connected ${r.email} – new invoices will show up in the Inbox`); await reload();
    } catch (x) {
      toast(x.message); b.disabled = false; b.textContent = 'Connect';
      if (/IMAP\) server|mail server/.test(x.message)) $('#imHostRow').hidden = false;
    }
    return true;
  }
  if (d.imapCheck !== undefined) { b.disabled = true; try { const r = await api('/imap/check', { method: 'POST' }); toast(r.found ? `${r.found} new email${r.found === 1 ? '' : 's'} – see the Inbox` : 'Nothing new'); } catch (x) { toast(x.message); } await reload(); return true; }
  if (d.imapOff !== undefined) {
    if (!b.dataset.sure) { b.dataset.sure = '1'; b.textContent = 'Sure? Disconnect'; return true; }
    await api('/imap', { method: 'DELETE' }); toast('Disconnected'); await reload(); return true;
  }
  return false;
}

let data = null;
const back = () => { location.href = (BOOT.home ? '/home?t=' : '/card?t=') + encodeURIComponent(BOOT.token); };
function render() {
  const st = data.settings;
  const hasMail = (data.outlook && data.outlook.connected) || data.imap;
  $('#content').innerHTML = `
  <div class="panel step ${st.business_name ? 'done' : ''}"><div class="num">1</div><div><h2>Your business</h2>
    <label class="f" for="bn">Business name</label><input type="text" id="bn" value="${esc(st.business_name)}" placeholder="e.g. Smith Garage Doors">
    <label class="f" for="bt">What the business does</label><input type="text" id="bt" value="${esc(st.business_type === 'trades business' ? '' : st.business_type)}" placeholder="e.g. garage door installation business">
    <div style="margin-top:8px"><button data-save-biz>Save</button></div></div></div>
  <div class="panel step ${hasMail ? 'done' : ''}"><div class="num">2</div><div><h2>Where your supplier invoices arrive</h2>
    <div class="hint">Job Costs reads the invoices in your mailbox, keeps only the bills, and suggests the job each one is for. You approve them in the 📥 Inbox.</div>
    ${mailboxHtml(data)}
    <div class="hint" style="margin-top:8px">No email? You can also drop invoice files on any job, or upload them in the Inbox.</div></div></div>
  <div class="panel step ${data.priceLists.length ? 'done' : ''}"><div class="num">3</div><div><h2>Price lists <span class="muted" style="font-weight:600;font-size:12px">(optional)</span></h2>
    <div class="hint">Upload a supplier's or subcontractor's price list (PDF or photo) and every invoice from them is checked against it.</div>
    ${data.priceLists.map((p) => `<div class="mb">✓ <b>${esc(p.supplier)}</b> <span class="muted">${esc(p.name || '')}</span></div>`).join('')}
    <form id="plForm" class="pl"><input type="text" name="supplier" placeholder="Supplier, e.g. Gliderol" required><input type="file" name="file" accept="application/pdf,image/*" required><button type="submit">⬆ Upload</button></form></div></div>
  <div class="save"><button class="primary" data-finish>${hasMail || data.priceLists.length ? 'Done – start using Job Costs' : 'Skip for now'}</button></div>`;
}
async function load() {
  try { data = await api('/settings'); render(); } catch (e) { $('#content').innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
}
document.addEventListener('click', async (e) => {
  const b = e.target.closest('button'); if (!b) return;
  try {
    if (await mailboxClick(b, load)) return;
    if (b.dataset.saveBiz !== undefined) {
      await api('/settings', { method: 'PUT', body: JSON.stringify({ business_name: $('#bn').value, business_type: $('#bt').value }) });
      toast('Saved'); return load();
    }
    if (b.dataset.finish !== undefined) {
      await api('/settings', { method: 'PUT', body: JSON.stringify({ onboarded: true }) });
      return back();
    }
  } catch (x) { toast(x.message); }
});
document.addEventListener('submit', async (e) => {
  e.preventDefault();
  const b = e.target.querySelector('button'); b.disabled = true;
  try { await api('/price-lists', { method: 'POST', body: new FormData(e.target) }); toast('Price list saved'); load(); }
  catch (x) { toast(x.message); b.disabled = false; }
});
load();
</script>
</body>
</html>
