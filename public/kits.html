<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Items &amp; parts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f4f7f6; --card: #fff; --ink: #17312b; --muted: #6b8a82; --line: #e3ece9; --line2: #f0f5f3;
    --brand: #10b981; --brand-dark: #059669; --brand-soft: #e7f8f1; --warn: #b45309; --warn-soft: #fef3c7;
    --bad: #be123c; --bad-soft: #ffe4e6; --sun: #f97316;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 13.5px/1.45 "Plus Jakarta Sans", "Segoe UI", -apple-system, Roboto, Arial, sans-serif; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 18px 16px; }
  header { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-bottom: 6px; }
  header h1 { margin: 0; font-size: 22px; font-weight: 800; }
  .muted { color: var(--muted); }
  .badge { display: inline-flex; align-items: center; justify-content: center; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px; background: var(--sun); color: #fff; font-size: 11px; font-weight: 800; }
  button, .btn { font: inherit; font-weight: 600; border: 1px solid #d6e2de; background: #fff; color: var(--ink); border-radius: 10px; padding: 6px 12px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
  button.primary { background: var(--brand); border-color: var(--brand); color: #fff; box-shadow: 0 4px 12px rgba(16, 185, 129, .28); }
  button.danger { color: var(--bad); }
  select { font: inherit; border: 1px solid #d6e2de; border-radius: 10px; padding: 6px 8px; background: #fff; color: var(--ink); max-width: 260px; }
  .address { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 4px 0 18px; padding: 12px 14px; background: var(--card); border: 1px solid var(--line); border-radius: 16px; }
  .address code { background: var(--brand-soft); color: var(--brand-dark); padding: 5px 10px; border-radius: 8px; font-size: 13px; }
  h2 { font-size: 15px; margin: 20px 0 8px; display: flex; align-items: center; gap: 8px; }
  .item { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; margin-bottom: 8px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: center; }
  .item .t { font-weight: 700; font-size: 14px; }
  .item .sub { font-size: 12px; color: var(--muted); }
  .acts { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; align-items: center; }
  .chip { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 700; padding: 2px 9px; border-radius: 20px; white-space: nowrap; }
  .c-sugg { background: var(--warn-soft); color: #92400e; } .c-dup { background: #f1f5f9; color: #64748b; } .c-err { background: var(--bad-soft); color: var(--bad); } .c-proc { background: var(--brand-soft); color: var(--brand-dark); }
  .trace { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 5px; font-size: 11.5px; }
  .trace span { padding: 1px 8px; border-radius: 10px; background: #f0fdf4; color: #166534; }
  .trace span.left { background: var(--warn-soft); color: #92400e; }
  .trace span.dup { background: var(--bad-soft); color: var(--bad); }
  .lnk, .acts .lnk { background: none; border: 0; padding: 4px 6px; color: var(--brand-dark); text-decoration: underline; box-shadow: none; }
  .recent .item { background: #fbfdfc; }
  .empty { text-align: center; color: var(--muted); padding: 26px; background: var(--card); border: 1px dashed var(--line); border-radius: 16px; }
  .spin { display: inline-block; width: 11px; height: 11px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin .8s linear infinite; vertical-align: -2px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 9px 16px; border-radius: 12px; font-weight: 600; opacity: 0; transition: .2s; pointer-events: none; }
  .toast.show { opacity: 1; }
  @media (max-width: 720px) { .item { grid-template-columns: minmax(0, 1fr); } .acts { justify-content: flex-start; } }
.move{display:inline-flex;gap:4px;align-items:center}.move input{width:90px;font:inherit;border:1px solid #d6e2de;border-radius:8px;padding:3px 6px}
.pen{border:0;background:none;cursor:pointer;color:#64748b;padding:0 2px;font-size:13px}
.dupwarn{color:#b42318;font-size:12px;font-weight:600;margin-top:3px;max-width:240px;white-space:normal}
  @media (max-width: 640px) { .wrap { padding: 12px 10px; } .panel { overflow-x: auto; } header h1 { font-size: 19px; } }
</style>
<style>
  .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 6px 0 12px; }
  .bar input[type=search] { flex: 1; min-width: 220px; font: inherit; border: 1px solid #d6e2de; border-radius: 10px; padding: 8px 12px; background: #fff; }
  .seg button { border-radius: 10px; }
  .seg button.on { background: var(--brand); color: #fff; border-color: var(--brand); }
  table.bills { width: 100%; border-collapse: collapse; background: var(--card); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
  table.bills th { text-align: left; font-size: 11.5px; color: var(--muted); font-weight: 700; padding: 9px 10px; border-bottom: 1px solid var(--line); background: #fbfdfc; }
  table.bills td { padding: 9px 10px; border-bottom: 1px solid var(--line2); vertical-align: middle; }
  table.bills tr:last-child td { border-bottom: 0; }
  table.bills tr.sel td { background: var(--brand-soft); }
  .num, table.bills th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .c-paid { background: var(--brand-soft); color: var(--brand-dark); } .c-unpaid { background: var(--bad-soft); color: var(--bad); } .c-part { background: var(--warn-soft); color: #92400e; }
  .foot { position: sticky; bottom: 0; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 12px; padding: 12px 14px; background: var(--card); border: 1px solid var(--line); border-radius: 16px; box-shadow: 0 -4px 16px rgba(16,40,34,.06); }
  .foot .spacer { flex: 1; }
  .lnk { background: none; border: 0; padding: 0 2px; color: var(--brand-dark); text-decoration: underline; cursor: pointer; font: inherit; box-shadow: none; }
</style>
<style>
  .kpis { display: flex; gap: 10px; flex-wrap: wrap; margin: 6px 0 4px; }
  .kpi { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 10px 14px; min-width: 150px; }
  .kpi .l { font-size: 11.5px; color: var(--muted); font-weight: 700; } .kpi .v { font-size: 20px; font-weight: 800; }
  .lines { margin-top: 6px; } .lines .ln { margin-top: 5px; font-size: 12.5px; }
  details.used summary { cursor: pointer; font-weight: 700; font-size: 15px; margin: 20px 0 8px; }
</style>
<style>
  .wrap { max-width: 760px; }
  .kit { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; margin-bottom: 10px; }
  .kit label { display: block; font-weight: 700; font-size: 12.5px; margin: 8px 0 3px; }
  .kit input, .kit textarea { font: inherit; border: 1px solid #d6e2de; border-radius: 10px; padding: 8px 10px; width: 100%; box-sizing: border-box; background: #fff; }
  .kit textarea { min-height: 120px; }
  .hint { font-size: 12.5px; color: var(--muted); }
  .r { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
  @media (max-width: 640px) { .wrap { padding: 12px 10px; } }
  .bi { padding: 6px 0; border-top: 1px solid var(--line2); } details.kit summary { cursor: pointer; }
</style>
</head>
<body>
<div class="wrap">
  <header><a class="btn" href="#" onclick="history.length > 1 ? history.back() : (location.href='/card?t='+encodeURIComponent(BOOT.token));return false" style="margin-right:4px">← Back</a><h1>🧩 Items &amp; parts</h1></header>
  <div class="hint" style="margin:6px 0 12px">The picking list finds each thing on the job's lines, invoices and notes, and gives it the boxes below.</div>
  <div id="content"><div class="empty"><span class="spin"></span></div></div>
</div>
<div class="toast" id="toast"></div>
<script>
const BOOT = /*__BOOT__*/null;
// Session: the server sends a fresh token while the window is in use; links on the page and the address bar follow it.
function noteToken(res) {
  const nt = res && res.headers && res.headers.get('X-Session-Token');
  if (!nt || !BOOT || nt === BOOT.token) return;
  const oldEnc = encodeURIComponent(BOOT.token), newEnc = encodeURIComponent(nt);
  BOOT.token = nt;
  try { T = newEnc; } catch (e) { /* this page keeps no copy */ }
  document.querySelectorAll('a[href]').forEach((a) => { if (a.getAttribute('href').includes(oldEnc)) a.setAttribute('href', a.getAttribute('href').split(oldEnc).join(newEnc)); });
  if (location.search.includes(oldEnc)) history.replaceState(null, '', location.href.split(oldEnc).join(newEnc));
}
try { const u = new URL(location.href); if (BOOT && BOOT.token && u.searchParams.get('t') && u.searchParams.get('t') !== BOOT.token) { u.searchParams.set('t', BOOT.token); history.replaceState(null, '', u); } } catch (e) { /* fine */ }
if (BOOT && BOOT.home) document.querySelectorAll('[data-back]').forEach((a) => { a.textContent = '← Job Costs home'; });
// On the ServiceM8 iPhone/iPad app a new tab means leaving ServiceM8 for Safari: open our own pages in this window instead
// (Microsoft's sign-in stays outside: it won't show inside a frame).
(function () {
  const ios = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  if (!ios) return;
  document.addEventListener('click', (e) => {
    const a = e.target.closest && e.target.closest('a[target="_blank"]');
    if (!a || !a.href) return;
    let u; try { u = new URL(a.href, location.href); } catch (x) { return; }
    if (u.origin !== location.origin || u.pathname.startsWith('/outlook/')) return;
    e.preventDefault(); location.href = u.href;
  }, true);
})();
setInterval(() => { if (BOOT && BOOT.token) fetch('/api/ping', { headers: { Authorization: 'Bearer ' + BOOT.token } }).then(noteToken).catch(() => {}); }, 30 * 60 * 1000);
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const money = (n) => (Number(n) || 0).toLocaleString('en-AU', { style: 'currency', currency: 'AUD' });
const fmtDate = (d) => d ? new Date(String(d).slice(0, 10) + 'T00:00:00').toLocaleDateString('en-AU', { day: 'numeric', month: 'short', year: 'numeric' }) : '';
function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 2600); }
async function api(path, opts = {}) {
  const res = await fetch('/api' + path, { ...opts, headers: { Authorization: 'Bearer ' + BOOT.token, ...(opts.body ? { 'Content-Type': 'application/json' } : {}) } });
  noteToken(res);
  const body = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(body.error || 'Something went wrong');
  return body;
}
let kits = [];
const partText = (p) => `${p.qty ? p.qty + ' x ' : ''}${p.name}`;
function form(k) {
  const id = k ? k.id : 'new';
  return `<div class="kit">${k ? '' : '<b>＋ New item</b>'}
    <label for="n-${id}">Name</label><input id="n-${id}" value="${esc(k ? k.name : '')}" placeholder="e.g. Gate motor">
    <label for="w-${id}">Words that find it (comma between)</label><input id="w-${id}" value="${esc(k ? k.match_words.join(', ') : '')}" placeholder="e.g. gate motor, sliding gate">
    <label for="p-${id}">Parts – one per line. "2 x Tracks" for a quantity, "(if needed)" for optional ones</label>
    <textarea id="p-${id}" placeholder="Door panels&#10;Tracks&#10;Springs&#10;Low headroom kit (if needed)">${esc(k ? k.parts.map(partText).join('\n') : '')}</textarea>
    <div class="r"><button class="primary" data-save="${id}">${k ? 'Save' : 'Add item'}</button>${k ? `<button class="danger" data-del="${id}">Delete</button>` : ''}</div></div>`;
}
let built = [], models = { chain_models: [], belt_models: [] };
function render() {
  let h = `<div class="kit"><b>Chain or belt?</b><div class="hint" style="margin:4px 0 6px">Motor models with a chain or a belt track. When the job says neither, the model decides –
    and when you pick Chain or Belt on a job, its model is added here.</div>
    <label for="m-chain">Chain models (comma between)</label><input id="m-chain" value="${esc(models.chain_models.join(', '))}" placeholder="e.g. mr650, ms65">
    <label for="m-belt">Belt models</label><input id="m-belt" value="${esc(models.belt_models.join(', '))}" placeholder="e.g. mr850">
    <div class="r"><button class="primary" data-models>Save</button></div></div>`;
  h += `<details class="kit"><summary><b>Built-in items</b> <span class="hint">(${built.length})</span></summary>${built.map((b) => `<div class="bi"><b>${esc(b.name)}</b>${b.parts.length ? `<div class="hint">${b.parts.map(esc).join('<br>')}</div>` : '<div class="hint">one box</div>'}</div>`).join('')}</details>`;
  h += `<h3 style="margin:18px 0 4px">Your own items</h3><div class="hint" style="margin-bottom:8px">For things the built-in ones don't cover, or to give one your own parts. Yours are looked for first.</div>`;
  $('#content').innerHTML = h + kits.map(form).join('') + form(null);
}
async function load() { try { const r = await api('/kits'); kits = r.kits; built = r.builtIn || []; models = r; render(); } catch (e) { $('#content').innerHTML = `<div class="empty">${esc(e.message)}</div>`; } }
document.addEventListener('click', async (e) => {
  const b = e.target.closest('button'); if (!b) return;
  const d = b.dataset;
  try {
    if (d.save) {
      const id = d.save;
      await api('/kits', { method: 'POST', body: JSON.stringify({ id: id === 'new' ? null : Number(id), name: $('#n-' + id).value, match_words: $('#w-' + id).value, parts: $('#p-' + id).value }) });
      toast('Saved'); return load();
    }
    if (d.models !== undefined) {
      await api('/kits/models', { method: 'PUT', body: JSON.stringify({ chain_models: $('#m-chain').value, belt_models: $('#m-belt').value }) });
      toast('Saved'); return load();
    }
    if (d.del) {
      if (!d.sure) { d.sure = '1'; b.textContent = 'Sure? Delete'; return; }
      await api('/kits/' + d.del, { method: 'DELETE' }); toast('Deleted'); return load();
    }
  } catch (x) { toast(x.message); }
});
load();
</script>
</body>
</html>
